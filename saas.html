<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agendio">
<meta name="robots" content="noindex,nofollow">
<title>Agendio</title>
<meta name="theme-color" content="#12302a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="pix.js"></script>
<style>
/* Mesma identidade do site: verde claro, verde-floresta como cor de marca, títulos em serifa macia (Fraunces) e texto em DM Sans. */
:root{
  color-scheme:light;
  --bg:#f3f6f2;--surface:#ffffff;--ink:#10231d;--muted:#51625b;--line:#dfe6e1;--line-2:#eaf0ec;
  --accent:#10382f;--accent-hover:#0a261f;--accent-ink:#ffffff;--accent-soft:#dcebdf;
  --side:#c9e2cd;--side-ink:#10231d;--side-muted:#3d5a4b;--side-hover:rgba(16,56,47,.08);--side-on:rgba(16,56,47,.15);
  --gold:#f6e9a8;--viz-1:#1f6f55;--viz-2:#5a46c8;
  --ok:#1d7a52;--ok-soft:#dcf1e6;--warn:#b0322a;--warn-soft:#fbe6e3;--amber:#8a5a00;--amber-soft:#fcefd2;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 2px rgba(16,35,29,.05),0 6px 20px -12px rgba(16,35,29,.2);
  --tons:linear-gradient(90deg,#1d1411 0 11.11%,#3a2418 0 22.22%,#5b3a22 0 33.33%,#7e5532 0 44.44%,#a57a48 0 55.55%,#c99f66 0 66.66%,#e0bf86 0 77.77%,#efd8ab 0 88.88%,#f6e8cd 0 100%);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,.stat b,.side b,.side-val{font-variant-numeric:tabular-nums}

/* Cabeçalho (celular) e menu lateral (computador) */
.top{position:sticky;top:0;z-index:20;background:var(--side);color:var(--side-ink)}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;padding-block:12px 4px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:21px;line-height:1.1;letter-spacing:.005em}
.brand-name span{margin-left:.25em}
.mono{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#10382f;color:#f6e9a8;font-family:var(--font-display);font-size:16px;letter-spacing:0}
.tone{height:4px;border-radius:2px;background:var(--tons);margin:6px 0 2px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--side-muted)}
.sync .linkbtn{color:var(--side-ink);text-decoration:underline;text-underline-offset:3px}
.who{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--side-muted)}
.dot.on{background:#5fd39a}.dot.off{background:#ff8f82}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px 10px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:8px 13px;border-radius:99px;font:inherit;font-weight:500;color:var(--side-muted);white-space:nowrap;cursor:pointer}
.tabs button:hover{background:var(--side-hover);color:var(--side-ink)}
.tabs button[aria-current="page"]{background:var(--side-on);color:var(--side-ink);font-weight:700}
.ic{width:18px;height:18px;flex:none}

main.wrap{padding-block:20px 72px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;margin:2px 0 18px}
h1{font-family:var(--font-display);font-weight:500;font-size:34px;line-height:1.05;letter-spacing:-.025em;margin:0;font-variation-settings:'opsz' 120,'SOFT' 100}
.page-head p{margin:4px 0 0;font-size:14px}
.page-head .hoje{font-size:13px}
h2{font-family:var(--font-display);font-weight:500;font-size:27px;line-height:1.12;letter-spacing:-.02em;font-variation-settings:'opsz' 96,'SOFT' 100;margin:4px 0 12px;text-wrap:balance}
h3{font-family:var(--font-body);font-weight:700;font-size:14px;color:var(--ink);margin:26px 0 10px;letter-spacing:.005em}
.muted{color:var(--muted)}

/* Campos e botões */
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar>input,.bar>select{flex:1 1 200px;min-width:0}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink);transition:border-color .12s,box-shadow .12s}
input:hover,select:hover,textarea:hover{border-color:#cdbcc5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.btn.danger{background:transparent;color:var(--warn);border-color:transparent}
.btn.danger:hover{background:var(--warn-soft);border-color:var(--warn-soft)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--accent);cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
a.wa{color:var(--ok);font-weight:600;text-decoration:none}
a.btn{text-decoration:none;display:inline-block;text-align:center}
a.btn.wa-btn{background:var(--ok);border-color:var(--ok);color:#fff}
a.btn.wa-btn:hover{filter:brightness(1.08)}
a.btn.wa-btn.ghost{background:transparent;color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
a.btn.wa-btn.ghost:hover{background:var(--ok-soft);color:var(--ok)}
.cmp-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch}
.cmp{border-collapse:separate;border-spacing:0;width:100%;min-width:520px;font-size:14px}
.cmp th,.cmp td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--line);vertical-align:middle}
.cmp tr:last-child td{border-bottom:0}
.cmp thead th{font-weight:700;background:var(--surface);position:sticky;top:0}
.cmp tbody th{text-align:left;font-weight:600;color:var(--muted);position:sticky;left:0;background:var(--surface);min-width:150px;z-index:1}
.cmp .cmp-atual{background:var(--accent-soft)}
.cmp .cmp-preco{font-size:17px;font-weight:800}
.cmp .sim{color:var(--ok);font-weight:800}.cmp .nao{color:var(--muted);opacity:.6}
.cmp .cmp-tag{display:block;font-size:11.5px;font-weight:600;color:var(--accent);margin-top:2px}
.cmp .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:600;color:var(--ink)}
label.chk input{width:auto}

/* Listas */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line-2)}
.item:first-child{border-top:0}
.item.click{cursor:pointer;transition:background .12s}
.item.click:hover{background:var(--accent-soft)}
.grow{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.t{font-weight:650;font-size:15.5px}
.grow .muted{font-size:13.5px}
.side{text-align:right;font-size:13px;color:var(--muted);line-height:1.4}
.side b{display:block;font-size:16px;color:var(--ink);font-weight:650}
.side-val{font-size:17px;font-weight:700;white-space:nowrap}
.item-acts{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.obs{margin-top:4px;overflow-wrap:anywhere;font-size:14px}
.av{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;font-weight:700;font-size:14px;letter-spacing:.01em}
.item .av{margin-right:2px}
.chthread{max-height:42vh;overflow:auto;margin:10px 0}.chm{padding:10px 12px;border-radius:12px;margin:8px 0;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--line-2)}.chm.suporte{background:var(--accent-soft);margin-left:auto}.chm b{font-size:13px}
#tabs button[data-n]::after,.segs button[data-n]::after{content:attr(data-n);margin-left:8px;background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:16px}
.cal-h{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:4px 0}
.cal-d{all:unset;box-sizing:border-box;cursor:pointer;min-height:112px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden}
.cal-d:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cal-d.fora{opacity:.45}.cal-d.hoje .n{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px}
.cal-d.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cal-d .n{font-weight:600;font-size:14px;align-self:flex-start}
.cal-d .c{position:absolute;top:6px;right:6px;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:0 7px}
.cal-d .chips i{display:block;font-style:normal;font-size:11px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.cal-d .bl{font-size:10px;color:var(--muted);border-top:1px dashed var(--line);margin-top:auto}
.cal-det{margin-top:6px}
.dia-lista{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}.dia-lista.hoje{border-color:var(--accent)}.dl-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dia-lista .list{margin-top:8px}
@media(max-width:640px){.cal{gap:3px}.cal-d{min-height:54px;padding:4px;align-items:center}.cal-d .chips{display:none}.cal-d .c{position:static;margin-top:auto}.cal-d .bl{display:none}.cal-d .n{align-self:center}}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:650;background:var(--line-2);color:var(--muted);vertical-align:1px}
.tag.late{background:var(--amber-soft);color:var(--amber)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}

/* Resumos */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:18px}
.stat{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat span{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.3}
.stat b{display:block;font-size:25px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.stat b.neg,.side b.neg{color:var(--warn)}
.barv{height:6px;background:var(--line-2);border-radius:99px;margin-top:8px}
.barv i{display:block;height:100%;background:var(--accent);border-radius:99px}
.empty{background:var(--surface);border:1px dashed #d8c8d0;border-radius:14px;padding:30px 22px}
.empty h2{font-size:24px}
.empty p{margin:0 0 14px;color:var(--muted);max-width:52ch}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.head-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
.head-card h2{margin:0 0 4px;font-size:30px}
.custo-msg{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0;box-shadow:var(--shadow)}
.custo-msg .custo-ic{flex:none;width:38px;height:38px;border-radius:11px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.custo-msg .muted{font-size:13.5px;margin-top:1px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel p{margin:0 0 12px}
.seg{display:inline-flex;gap:2px;padding:3px;margin:0 0 16px;background:var(--line-2);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.seg .btn{border:0;border-radius:9px;background:transparent;color:var(--muted);padding:7px 14px}
.seg .btn:hover{background:transparent;color:var(--ink)}
.seg .btn:not(.ghost){background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(42,23,34,.14)}

/* Entrada */
body:not(.logado) .top{display:none}
body:not(.logado) main.wrap{max-width:none;padding:0}
.auth-links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:18px;font-size:14px}
.ok-msg{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--ok-bg,#e8f3ea);color:var(--ok-ink,#1f5a2e);font-size:14px}
.faixa{margin:0 0 14px;padding:9px 12px;border-radius:10px;background:var(--gold-soft,#f7ecd6);color:var(--ink,#2a1722);font-size:13px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.erro{color:var(--warn);min-height:1.3em;margin:10px 0 0;font-weight:500}
.entrada{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.entrada-marca{position:relative;overflow:hidden;color:var(--side-ink);padding:36px clamp(28px,5vw,76px);display:grid;grid-template-rows:auto 1fr auto;gap:28px;
  background:radial-gradient(110% 70% at 0% 0%,#e3f2e6 0,#c9e2cd 52%,#b3d3ba 100%)}
.entrada-marca::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:linear-gradient(90deg,#10382f 0 25%,#f9dcd6 0 50%,#f6e9a8 0 75%,#e4dcf5 0)}
.marca-topo{display:flex;align-items:center;gap:11px;font-family:var(--font-display);font-size:26px;line-height:1;color:var(--side-ink)}
.marca-topo .mono{width:36px;height:36px;font-size:17px}
.marca-meio{align-self:center;max-width:520px}
.entrada-marca h1{font-size:clamp(38px,4.4vw,60px);line-height:1.03;color:var(--side-ink);margin:0 0 16px;text-wrap:balance}
.marca-meio>p{margin:0 0 34px;max-width:40ch;color:var(--side-muted);font-size:17px;line-height:1.55}
.amostra{margin:0;max-width:430px;padding:16px 18px 8px;border-radius:18px;background:rgba(255,255,255,.55);border:1px solid rgba(16,56,47,.12);box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.amostra figcaption{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:12px;color:var(--side-muted)}
.amostra figcaption b{color:var(--side-ink);font-weight:700}
.am-linha{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid rgba(16,56,47,.1)}
.am-hora{padding-top:9px;font-size:12.5px;color:var(--side-muted);font-variant-numeric:tabular-nums}
.am-bloco{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:10px;color:#241510;font-size:14px;font-weight:650}
.am-bloco small{font-weight:550;opacity:.72;white-space:nowrap}
.am-livre{align-items:center;border:1px dashed rgba(16,56,47,.3);background:transparent;color:var(--side-muted);font-weight:500}
.marca-pe{margin:0;max-width:46ch;font-size:13px;color:var(--side-muted)}
.entrada>.login-lado{display:grid;align-items:center;justify-items:center;padding:32px 20px;background:var(--bg)}
.login{width:min(420px,100%);padding:34px 32px 30px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow),0 30px 60px -40px rgba(42,23,34,.35)}
.entrada.longo .login-lado{align-items:start}
.login h2{margin:0 0 4px;font-size:32px}
.login>p.muted{margin:0 0 6px}
.login .btn{width:100%;min-height:46px;padding:12px 16px;margin-top:8px;font-size:15.5px}
.login .acts{margin-top:10px}
.login .auth-links{justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--line-2)}
.pw{position:relative}
.pw input[type=password],.pw input[type=text]{padding-right:84px}
.pw .ver-chk{position:absolute;right:6px;top:50%;width:70px;height:34px;margin:-17px 0 0;opacity:0;cursor:pointer;z-index:2}
.pw .ver{position:absolute;right:6px;top:50%;transform:translateY(-50%);margin:0;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:650;color:var(--accent);pointer-events:none}
.pw .ver-chk:hover+.ver{background:var(--accent-soft)}
.pw .ver-chk:focus-visible+.ver{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:860px){
  .entrada{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .entrada-marca{padding:20px 22px 24px;gap:10px;grid-template-rows:auto auto}
  .marca-meio{max-width:none}
  .entrada-marca h1{font-size:28px;margin:0}
  .marca-meio>p,.amostra,.marca-pe{display:none}
  .entrada>.login-lado{padding:20px 16px 32px;align-items:start}
  .login{padding:26px 22px 24px}
}

/* Janelas, avisos */
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(560px,calc(100vw - 32px));max-height:90dvh;overflow:auto;box-shadow:0 24px 60px -20px rgba(20,8,16,.5)}
dialog::backdrop{background:rgba(26,12,20,.58);backdrop-filter:blur(2px)}
dialog h2{margin-top:0;font-size:28px}
.pg-abas{display:flex;gap:6px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.pg-abas button{border:0;background:none;padding:9px 14px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.pg-abas button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.pg-qr{display:flex;justify-content:center;margin:6px 0 12px}.pg-qr svg,.pg-qr img{width:210px;height:210px;border-radius:10px;background:#fff}
.pg-copia{display:flex;gap:8px}.pg-copia input{flex:1;min-width:0}
.pg-cupom{margin:0 0 12px}.pg-cupom summary{cursor:pointer;color:var(--muted);font-size:14px;margin-bottom:8px}
.pg-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mpf{height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);display:flex;align-items:center}
.mpf iframe{height:100%!important}

.hr-linha{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}.hr-linha .chk{min-width:112px;margin:0}.hr-linha input[type=time]{width:auto;min-width:104px}

/* =====================================================================
   ATELIÊ: identidade visual do app (papel de seda + mata + cobre)
   Menu lateral escuro com régua de cobre, páginas de papel, cantos discretos.
   Fica no fim para valer sobre o resto. Remova este bloco para voltar ao visual anterior.
   ===================================================================== */
:root{
  --bg:#f1eee6;--surface:#fbfaf6;--ink:#1a2420;--muted:#5b655f;--line:#d8d2c4;--line-2:#e8e3d7;
  --accent:#96562b;--accent-hover:#7a4220;--accent-ink:#ffffff;--accent-soft:#f0e1d1;
  --side:#12302a;--side-ink:#f1ead9;--side-muted:#a7bbb0;--side-hover:rgba(241,234,217,.07);--side-on:rgba(241,234,217,.12);
  --cobre:#c8814e;--cobre-claro:#e3b48a;
  --shadow:none;
  --r-card:10px;--r-ctl:8px;
}
body{background:var(--bg)}
/* Tela de entrada: painel verde-claro precisa de texto escuro (o menu escuro usa texto claro) */
.entrada-marca{--side-ink:#10231d;--side-muted:#3d5a4b}
h1,h2{font-weight:400;font-variation-settings:'opsz' 144,'SOFT' 50}
h3{font-family:var(--font-display);font-weight:500;font-size:19px;letter-spacing:-.005em;margin:30px 0 10px}

/* ---- Superfícies: papel plano, filete fino, sem sombra ---- */
.list,.panel,.head-card,.empty,.card,.stat,.dia-lista{border-radius:var(--r-card);box-shadow:none;border-color:var(--line);background:var(--surface)}
.empty{border-style:dashed;border-color:#c9c2b2}
.item{padding:14px 20px;border-top-color:var(--line-2)}
.item.click:hover{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.btn,input,select,textarea{border-radius:var(--r-ctl)}
input,select,textarea{background:#fffefb}
input:hover,select:hover,textarea:hover{border-color:#b9b19e}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--accent-soft);border-color:var(--accent-soft)}
.tag{border-radius:6px;padding:1px 8px;font-weight:600}
.cal-d{border-radius:6px;background:var(--surface)}
.cal-d.hoje .n{background:var(--accent)}
dialog{border-radius:12px;background:var(--surface);box-shadow:0 30px 60px -24px rgba(18,48,42,.45)}
dialog::backdrop{background:rgba(18,48,42,.55)}
.toast-in{background:var(--side);color:var(--side-ink);border-radius:10px;border-left:3px solid var(--cobre)}

/* ---- Título da página: o papel de revista ---- */
.page-head{border-bottom:1px solid var(--line);position:relative;padding-bottom:16px;margin-bottom:22px}
.page-head::after{content:"";position:absolute;left:0;bottom:-1px;width:56px;height:2px;background:var(--cobre)}
.page-head h1{font-size:clamp(34px,4.6vw,50px);line-height:1;letter-spacing:-.03em;font-weight:400}
.page-head p{font-size:14.5px}

/* ---- Números em serifa, como cifras de uma agenda impressa ---- */
.stats{gap:0;border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);overflow:hidden}
.stats .stat{border:0;border-radius:0;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);margin:0 -1px -1px 0;background:transparent}
.stat{padding:18px 20px 16px}
.stat b{font-family:var(--font-display);font-size:34px;font-weight:400;letter-spacing:-.025em;font-variation-settings:'opsz' 144,'SOFT' 50}
.stat span{font-size:13px;font-weight:500;color:var(--muted)}
@media (max-width:480px){.stat b{font-size:27px}}

/* ---- Menu lateral (computador): mata profunda, régua de cobre ---- */
.top{background:var(--side);color:var(--side-ink)}
.mono{background:transparent;color:var(--cobre-claro);border:1.5px solid var(--cobre);font-style:italic;font-weight:500}
.brand{font-style:italic;font-weight:400;letter-spacing:-.01em}
.tone{height:3px;opacity:.9}
.dot.on{background:#7fd9a8}
@media (min-width:860px){
  body.logado{grid-template-columns:268px minmax(0,1fr)}

  body.logado .tone{margin:14px 24px 18px;height:3px}
  body.logado .salao-id{margin:0 18px 8px;padding:11px 12px;border-radius:8px;background:transparent;border:1px solid rgba(241,234,217,.16)}
  body.logado .salao-id b{font-family:var(--font-display);font-weight:500;font-size:16px;color:var(--side-ink)}
  body.logado .salao-id span{color:var(--cobre-claro);font-size:12px}
  body.logado .salao-id img{border-radius:6px}
  body.logado .tabs{padding:0 18px;margin-inline:0;gap:1px}
  body.logado .tabs .grp{display:flex;align-items:center;gap:10px;margin:20px 8px 6px;font-family:var(--font-display);font-style:italic;font-weight:400;font-size:15px;color:var(--cobre-claro);opacity:1}
  body.logado .tabs .grp::after{content:"";flex:1;height:1px;background:rgba(241,234,217,.16)}
  body.logado .tabs .grp:first-child{margin-top:8px}
  body.logado .tabs button{border-radius:6px;padding:9px 10px 9px 12px;gap:13px;font-size:14.5px;font-weight:450;color:var(--side-muted)}
  body.logado .tabs button .ic{opacity:.75;stroke-width:1.6}
  body.logado .tabs button:hover{background:var(--side-hover);color:var(--side-ink)}
  body.logado .tabs button:hover .ic{opacity:1}
  body.logado .tabs button[aria-current="page"]{background:var(--side-on);color:#fff;font-weight:600;box-shadow:none}
  body.logado .tabs button[aria-current="page"] .ic{opacity:1;color:var(--cobre-claro)}
  body.logado .tabs button[aria-current="page"]::before{left:-18px;top:6px;bottom:6px;width:3px;border-radius:0 2px 2px 0;background:var(--cobre)}
  body.logado .tabs button[data-n]::after{background:var(--cobre);color:#fff;margin-left:auto}
  body.logado .sync{margin:auto 24px 0;padding:14px 0 0;border-top:1px solid rgba(241,234,217,.16)}
  body.logado .who{color:var(--side-muted)}
  body.logado main.wrap{max-width:1160px;padding-inline:48px;padding-block:40px 80px}

function msgAuth(m,st){
  m=String(m||'');
  if(st===429||/rate limit|too many/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(/already registered|already been registered/i.test(m))return 'Este e-mail já tem cadastro. Entre ou recupere a senha.';
  if(/password.*(least|short|weak)|weak password/i.test(m))return 'Escolha uma senha mais forte (8 caracteres ou mais).';
  if(/signups? (not allowed|disabled)/i.test(m))return 'O cadastro de novas contas está desativado.';
  if(/invalid.*email|email.*invalid|unable to validate email/i.test(m))return 'Confira o e-mail digitado.';
  if(/same password|different from the old/i.test(m))return 'A nova senha precisa ser diferente da atual.';
  if(/session|jwt|not authenticated|auth session missing/i.test(m))return 'O link expirou. Peça um novo em "Esqueci a senha".';
  return 'Não foi possível concluir. Tente de novo.';
}

async function carregarEquipe(){
  try{

    if(m.error)throw m.error;
    S.eq={ok:true,membros:m.data||[],convites:(c&&c.data)||[],ult:{},logins:[]};
    if(S.ctx&&S.ctx.role==='proprietario'){try{const [u,l]=await Promise.all([sb.rpc('ultimos_acessos'),sb.rpc('acessos_equipe',{p_limite:40})]);if(!u.error)(u.data||[]).forEach(x=>{S.eq.ult[x.user_id]=x.quando});if(!l.error)S.eq.logins=l.data||[]}catch(_){}}

async function carregarSalao(){
  try{const r=await sb.from('tenants').select('*').eq('id',S.ctx.tenant.id);if(r.error)throw r.error;S.salao=(r.data&&r.data[0])||null;S.logoNovo=undefined
    S.assin={planos:[],pags:[]};
    if(S.ctx.role==='proprietario'){try{const [a,b]=await Promise.all([sb.from('plans').select('*').eq('ativo',true).order('preco_mensal'),sb.from('pagamentos').select('*').order('vencimento',{ascending:false}).limit(6)]);S.assin={planos:a.data||[],pags:b.data||[],auto:null};try{const c=await sb.from('assinaturas_mp').select('*').maybeSingle();if(!c.error)S.assin.auto=c.data||null}catch(_){}}catch(_){}}}
  catch(_){S.salao=false}
  if(S.view==='salao')render();
}
/* ---------- Pagamento dentro do Agendio (Pix e cartão) ---------- */
const MPX={mp:null,timer:null,qr:'',metodo:'',emissor:'',tentando:false};
async function apiMp(rota,corpo){
  const ses=await sb.auth.getSession(),tk=ses&&ses.data&&ses.data.session&&ses.data.session.access_token;
  if(!tk)throw new Error('Entre de novo para pagar.');
  const r=await fetch('/api/'+rota,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk},body:JSON.stringify(corpo)});
  let j=null;try{j=await r.json()}catch(_){}
  if(r.status===404&&!j)throw new Error('As funções de pagamento não estão publicadas no site. Avise o suporte. [404]');
  return {ok:r.ok,status:r.status,j:j||{}};
}
function msgApi(r){const j=r.j||{};return (j.erro||'O pagamento não respondeu. Tente de novo em instantes.')+(Array.isArray(j.faltando)&&j.faltando.length?' (falta configurar: '+j.faltando.join(', ')+')':'')}
function pararPagto(){if(MPX.timer){clearInterval(MPX.timer);MPX.timer=null}MPX.qr='';MPX.metodo='';MPX.emissor=''}
function carregaSdkMp(){return new Promise((ok,no)=>{if(window.MercadoPago)return ok();const t=setTimeout(()=>no(new Error('sdk')),15000),e=document.createElement('script');e.src='https://sdk.mercadopago.com/js/v2';e.onload=()=>{clearTimeout(t);ok()};e.onerror=()=>{clearTimeout(t);no(new Error('sdk'))};document.head.appendChild(e)})}
async function iniciaMp(){
  if(MPX.mp)return MPX.mp;
  const r=await fetch('/api/mp-config');let j=null;try{j=await r.json()}catch(_){}
  if(!j||!j.public_key)return null;
  await carregaSdkMp();
  MPX.mp=new window.MercadoPago(j.public_key,{locale:'pt-BR'});return MPX.mp;
}
function htmlCartao(modo,id){
  return `<p class="muted" style="margin:0 0 10px">${modo==='debito'?'Informe o cartão uma vez. A mensalidade é cobrada sozinha todo mês, e você cancela quando quiser.':'Pagamento seguro. Os dados do cartão vão direto para o Mercado Pago e não ficam guardados no Agendio.'}</p>
  <div id="pg-cartao-corpo"><p class="muted" id="pg-cartao-carrega">Carregando o formulário seguro…</p>
  <div id="pg-cartao-campos" hidden>
    <label>Número do cartão</label><div id="mpc-num" class="mpf"></div>
    <div class="pg-2"><div><label>Validade</label><div id="mpc-val" class="mpf"></div></div><div><label>Código (CVV)</label><div id="mpc-cvv" class="mpf"></div></div></div>
    <label for="mpc-nome">Nome como está no cartão</label><input id="mpc-nome" autocomplete="cc-name" maxlength="60">
    <label for="mpc-cpf">CPF do titular</label><input id="mpc-cpf" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000.000.000-00">
    <p class="erro" id="pg-erro" role="alert"></p>
    <div class="acts"><button type="button" class="btn" id="pg-cartao-ok" data-act="${modo==='debito'?'pgDebito':'pgCartao'}" data-id="${esc(id||'')}">${modo==='debito'?'Ativar débito automático':'Pagar com cartão'}</button></div>
  </div></div>`;
}
async function montaCartao(){
  const car=$('pg-cartao-carrega'),campos=$('pg-cartao-campos');if(!car||!campos)return;
  try{
    const mp=await iniciaMp();
    if(!mp){car.textContent='O pagamento com cartão dentro do sistema ainda não foi ativado. Use o Pix ou o botão do Mercado Pago abaixo.';return}
    if(!$('mpc-num'))return;
    campos.hidden=false;car.hidden=true;
    const n=mp.fields.create('cardNumber',{placeholder:'0000 0000 0000 0000'});n.mount('mpc-num');
    mp.fields.create('expirationDate',{placeholder:'MM/AA'}).mount('mpc-val');
    mp.fields.create('securityCode',{placeholder:'123'}).mount('mpc-cvv');
    n.on('binChange',async e=>{
      MPX.metodo='';MPX.emissor='';
      if(!e||!e.bin)return;
      try{const r=await mp.getPaymentMethods({bin:e.bin}),m=r&&r.results&&r.results[0];if(m){MPX.metodo=String(m.id||'');MPX.emissor=m.issuer&&m.issuer.id?String(m.issuer.id):''}}catch(_){}
    });
  }catch(_){car.textContent='Não foi possível carregar o formulário do cartão. Use o Pix ou o botão do Mercado Pago abaixo.'}
}
function abrirPagamento(id){
  const g=((S.assin&&S.assin.pags)||[]).find(x=>x.id===id);if(!g)return;
  pararPagto();
  abrir(`<h2>Pagar ${brl(g.valor)}</h2><p class="muted" style="margin:-8px 0 12px">${g.tipo==='mensagens'?esc(g.descricao||'Mensagens de WhatsApp'):Number(g.meses)>1?'Plano de '+Number(g.meses)+' meses do Agendio':'Mensalidade do Agendio'} · vence ${esc(fd(g.vencimento))}</p>
  <div class="pg-abas" role="tablist"><button type="button" role="tab" aria-selected="true" data-act="pgAba" data-id="pix">Pix</button><button type="button" role="tab" aria-selected="false" data-act="pgAba" data-id="cartao">Cartão de crédito</button></div>
  ${g.tipo!=='mensagens'&&!g.valor_original?`<details class="pg-cupom"><summary>Tem um cupom de desconto?</summary><div class="pg-copia"><input id="pg-cupom" placeholder="Digite o código" autocapitalize="characters" autocomplete="off" maxlength="30" aria-label="Código do cupom"><button type="button" class="btn sm" data-act="pgCupom" data-id="${esc(id)}">Aplicar</button></div><p class="erro" id="pg-cupom-erro" role="alert"></p></details>`:''}${g.valor_original?`<p class="muted" style="margin:0 0 10px">Cupom <b>${esc(g.cupom_codigo||'')}</b> aplicado: de ${brl(g.valor_original)} por ${brl(g.valor)}.</p>`:''}
  <div id="pg-pix" data-cob="${esc(id)}"><p class="muted" style="margin:0 0 10px">Aprovação em segundos. Você escaneia o QR Code ou copia o código no app do seu banco.</p><div id="pg-pix-corpo"><div class="acts"><button type="button" class="btn" data-act="pgPix" data-id="${esc(id)}">Gerar Pix</button></div></div></div>
  <div id="pg-cartao" hidden data-cob="${esc(id)}">${htmlCartao('cobranca',id)}</div>
  <div class="acts" style="margin-top:14px"><button type="button" class="btn ghost" data-act="pagarMPantigo" data-id="${esc(id)}">Prefiro pagar no site do Mercado Pago</button><button type="button" class="btn ghost" data-act="fechar">Fechar</button></div>`);
  // Se esta cobrança já foi paga (Pix pago e ainda não registrado), confere agora e libera.
  apiMp('mp-pix',{pagamento_id:id,acao:'conferir'}).then(c=>{if(c.ok&&c.j.pago&&$('pg-pix'))pgSucesso('Encontramos o seu pagamento. O seu plano já está em dia.')}).catch(()=>{});
}
async function aplicarCupom(id,btn){
  const er=$('pg-cupom-erro'),cod=String((($('pg-cupom')||{}).value)||'').trim();
  if(er)er.textContent='';
  if(!cod)return void(er&&(er.textContent='Digite o código do cupom.'));
  if(btn)btn.disabled=true;
  try{
    const r=await sb.rpc('aplicar_cupom',{p_pagamento:id,p_codigo:cod});
    if(r.error)throw r.error;
    if(!r.data||!r.data.ok){if(er)er.textContent=(r.data&&r.data.erro)||'Cupom inválido.';return}
    toast('Cupom aplicado! Você economizou '+brl(r.data.desconto)+'.');
    await carregarSalao();abrirPagamento(id);
  }catch(x){if(er)er.textContent=x&&x.code==='42501'?'Só o proprietário do salão pode aplicar cupom.':'Não foi possível aplicar o cupom agora. Tente de novo.'}finally{if(btn)btn.disabled=false}
}
function abrirDebito(){
  const pl=S.ctx&&S.ctx.plano;pararPagto();
  abrir(`<h2>Débito automático</h2><p class="muted" style="margin:-8px 0 12px">${pl?'Plano '+esc(pl.nome)+' · '+brl(pl.preco_mensal)+' por mês':''}</p>
  <div id="pg-cartao">${htmlCartao('debito','')}</div>
  <div class="acts" style="margin-top:14px"><button type="button" class="btn ghost" data-act="debitoAtivarMP">Prefiro autorizar no site do Mercado Pago</button><button type="button" class="btn ghost" data-act="fechar">Fechar</button></div>`);
  montaCartao();
}
function pgAba(qual){
  document.querySelectorAll('.pg-abas button').forEach(b=>b.setAttribute('aria-selected',b.dataset.id===qual?'true':'false'));
  const px=$('pg-pix'),ct=$('pg-cartao');if(px)px.hidden=qual!=='pix';if(ct)ct.hidden=qual!=='cartao';
  if(qual==='cartao'&&ct&&!ct.dataset.ok){ct.dataset.ok='1';montaCartao()}
}
function pgSucesso(msg){
  pararPagto();
  abrir(`<h2>Pagamento confirmado</h2><p>${esc(msg||'Recebemos o seu pagamento. O seu plano já está em dia.')}</p><div class="acts"><button type="button" class="btn" data-act="fechar">Fechar</button></div>`);
  carregarSalao();
}
async function gerarPix(id,btn){
  const corpo=$('pg-pix-corpo');if(btn){btn.disabled=true;btn.textContent='Gerando…'}
  try{
    const r=await apiMp('mp-pix',{pagamento_id:id});
    if(!r.ok||!r.j.qr)throw new Error(msgApi(r));
    MPX.qr=r.j.qr;
    let svg='';try{svg=window.AgendioPix.qrSvg(r.j.qr,'QR Code do Pix')}catch(_){svg=''}
    const img=svg||(/^[A-Za-z0-9+/=]+$/.test(r.j.qr_base64||'')?`<img alt="QR Code do Pix" width="200" height="200" src="data:image/png;base64,${r.j.qr_base64}">`:'');
    corpo.innerHTML=`<div class="pg-qr">${img}</div><label>Pix copia e cola</label><div class="pg-copia"><input id="pg-copia" readonly value="${esc(r.j.qr)}"><button type="button" class="btn sm" data-act="pgCopia">Copiar</button></div><p class="muted" id="pg-espera" role="status" style="margin:10px 0 0">Aguardando o pagamento… esta tela confirma sozinha assim que o Pix cair.</p>`;
    let n=0;if(MPX.timer)clearInterval(MPX.timer);
    MPX.timer=setInterval(async()=>{
      if(++n>360||!$('pg-pix-corpo')){pararPagto();return}
      try{const c=await apiMp('mp-pix',{pagamento_id:id,acao:'conferir'});if(c.ok&&c.j.pago)pgSucesso('Pix recebido! O seu plano já está em dia.');else if(c.ok&&c.j.aviso){const e=$('pg-espera');if(e)e.textContent=c.j.aviso}}catch(_){}
    },5000);
  }catch(x){if(btn){btn.disabled=false;btn.textContent='Gerar Pix'}toast((x&&x.message)||'Não foi possível gerar o Pix.',true)}
}
async function enviarCartao(modo,id,btn){
  const er=$('pg-erro'),fail=m=>{if(er)er.textContent=m;if(btn){btn.disabled=false;btn.textContent=btn.dataset.t||'Pagar com cartão'}MPX.tentando=false};
  if(MPX.tentando)return;
  const nome=(($('mpc-nome')||{}).value||'').trim(),cpf=((($('mpc-cpf')||{}).value)||'').replace(/\D/g,'');
  if(er)er.textContent='';
  if(nome.length<3||!/\s/.test(nome))return void(er&&(er.textContent='Digite o nome completo como está no cartão.'));
  if(cpf.length!==11)return void(er&&(er.textContent='Digite o CPF do titular (11 números).'));
  if(modo!=='debito'&&!MPX.metodo)return void(er&&(er.textContent='Confira o número do cartão.'));
  MPX.tentando=true;if(btn){btn.dataset.t=btn.textContent;btn.disabled=true;btn.textContent='Processando…'}
  try{
    const t=await MPX.mp.fields.createCardToken({cardholderName:nome,identificationType:'CPF',identificationNumber:cpf});
    if(!t||!t.id)throw new Error('cartao');
    if(modo==='debito'){
      const r=await apiMp('mp-assinar',{acao:'criar',token:t.id});
      if(r.ok&&r.j.ok){MPX.tentando=false;pararPagto();abrir(`<h2>Débito automático ativado</h2><p>O cartão será cobrado todo mês. Você pode cancelar quando quiser.</p><div class="acts"><button type="button" class="btn" data-act="fechar">Fechar</button></div>`);carregarSalao();return}
      return fail(r.ok?(r.j.erro||'O cartão não foi aceito.'):msgApi(r));
    }
    const r=await apiMp('mp-cartao',{pagamento_id:id,token:t.id,payment_method_id:MPX.metodo,issuer_id:MPX.emissor,cpf});
    if(!r.ok)return fail(msgApi(r));
    MPX.tentando=false;
    if(r.j.status==='approved')return pgSucesso('Pagamento aprovado! O seu plano já está em dia.');
    if(r.j.status==='in_process'){pararPagto();abrir(`<h2>Pagamento em análise</h2><p>O banco está analisando o pagamento. Assim que for aprovado, o seu plano é liberado sozinho.</p><div class="acts"><button type="button" class="btn" data-act="fechar">Fechar</button></div>`);return}
    return fail(r.j.erro||'O cartão foi recusado.');
  }catch(x){fail(x&&x.message&&x.message!=='cartao'&&!Array.isArray(x)?x.message:'Confira os dados do cartão (número, validade e código) e tente de novo.')}
}
async function pagarCobranca(id,btn){
  if(btn){btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent='Abrindo…'}
  const volta=()=>{if(btn){btn.disabled=false;btn.textContent=btn.dataset.t||'Pagar agora'}};
  const g=((S.assin&&S.assin.pags)||[]).find(x=>x.id===id);
  try{
    const ses=await sb.auth.getSession(),tk=ses&&ses.data&&ses.data.session&&ses.data.session.access_token;
    if(!tk)throw new Error('Entre de novo para pagar.');
    const r=await fetch('/api/mp-criar',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk},body:JSON.stringify({pagamento_id:id})});
    let j=null;try{j=await r.json()}catch(_){}
    if(r.ok&&j&&/^https:\/\//.test(j.url||'')){location.href=j.url;return}
    if(g&&/^https:\/\//.test(g.link_pagamento||'')){window.open(g.link_pagamento,'_blank','noopener');volta();return}
    const cod=r.status;
    if(j&&j.erro)throw new Error(j.erro+(Array.isArray(j.faltando)&&j.faltando.length?' (falta configurar: '+j.faltando.join(', ')+')':''));
    throw new Error(cod===404?'As funções de pagamento não estão publicadas no site (pasta "api" ausente na Vercel). Avise o suporte. [404]':'O pagamento online não respondeu. Tente de novo em instantes; se continuar, avise o suporte. ['+cod+']');
  }catch(x){volta();toast((x&&x.message)||'Não foi possível abrir o pagamento.',true)}
}
(function(){
  try{
    const q=new URLSearchParams(location.search),pg=q.get('pg');if(!pg)return;
    const msg={assinatura:'Recebemos a sua autorização! O Mercado Pago confirma em instantes e o débito automático aparece como ativo.',ok:'Pagamento enviado! A confirmação chega em instantes e libera o seu plano.',pendente:'Pagamento pendente. Assim que o Mercado Pago confirmar, o seu plano é liberado.',falha:'O pagamento não foi concluído. Você pode tentar de novo em Salão, Plano e assinatura.'}[pg];
    q.delete('pg');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash);
    if(msg)setTimeout(()=>toast(msg,pg==='falha'),1200);
  }catch(_){}
})();
function blocoDebito(pl){
  const a=(S.assin&&S.assin.auto)||null,st=a?a.status:'';
  if(st==='autorizada')return `<div class="panel" style="margin:14px 0 0;background:var(--accent-soft)"><b>Débito automático ativo</b><p class="muted" style="margin:4px 0 8px">O cartão é cobrado todo mês (${brl(a.valor)})${a.proximo_debito?', próximo em '+esc(fd(a.proximo_debito)):''}. Você não precisa pagar nada à mão.</p><button class="btn ghost sm" data-act="debitoParar">Cancelar débito automático</button></div>`;
  if(!pl)return '';
  return `<div class="panel" style="margin:14px 0 0"><b>Débito automático</b><p class="muted" style="margin:4px 0 8px">${st==='pendente'?'Você começou a ativar, mas ainda não concluiu. ':st==='cancelada'||st==='pausada'?'O débito automático está '+(st==='pausada'?'pausado':'cancelado')+'. ':''}Informe o cartão uma vez e a mensalidade do plano ${esc(pl.nome)} é cobrada sozinha todo mês. Dá para cancelar quando quiser.</p><button class="btn sm" data-act="debitoAtivar">${st==='pendente'?'Concluir ativação':'Ativar débito automático'}</button></div>`;
}
async function chamaAssinar(acao,btn){
  if(btn){btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent='Aguarde…'}
  const volta=()=>{if(btn){btn.disabled=false;btn.textContent=btn.dataset.t||'Ativar débito automático'}};
  try{
    const ses=await sb.auth.getSession(),tk=ses&&ses.data&&ses.data.session&&ses.data.session.access_token;
    if(!tk)throw new Error('Entre de novo para continuar.');
    const r=await fetch('/api/mp-assinar',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk},body:JSON.stringify({acao})});
    let j=null;try{j=await r.json()}catch(_){}
    if(r.ok&&acao==='criar'&&j&&/^https:\/\//.test(j.url||'')){location.href=j.url;return}
    if(r.ok&&acao==='cancelar'){volta();toast('Débito automático cancelado.');carregarSalao();return}
    if(j&&j.erro)throw new Error(j.erro+(Array.isArray(j.faltando)&&j.faltando.length?' (falta configurar: '+j.faltando.join(', ')+')':''));
    throw new Error(r.status===404?'As funções de pagamento não estão publicadas no site (pasta "api" ausente na Vercel). Avise o suporte. [404]':'O Mercado Pago não respondeu. Tente de novo em instantes.');
  }catch(x){volta();toast((x&&x.message)||'Não foi possível continuar.',true)}
}
const PER=[[1,'Mensal'],[6,'Semestral'],[12,'Anual']];
const perDesc=(pl,m)=>m===6?Number(pl.desc_semestral)||0:m===12?Number(pl.desc_anual)||0:0;
const perValor=(pl,m)=>Math.round(Number(pl.preco_mensal)*m*(1-perDesc(pl,m)/100)*100)/100;
function blocoPeriodo(pl){
  if(!pl||!(Number(pl.preco_mensal)>0)||(perDesc(pl,6)<=0&&perDesc(pl,12)<=0))return '';
  const a=(S.assin&&S.assin.auto)||null;
  if(a&&a.status==='autorizada')return '';
  const bt=PER.filter(([m])=>m===1||perDesc(pl,m)>0).map(([m,n])=>{const d=perDesc(pl,m),v=perValor(pl,m);
    return `<button type="button" class="btn ${m===1?'ghost':''} sm" data-act="periodoPagar" data-id="${m}" style="text-align:left;line-height:1.3"><b>${n}</b>${d>0?` <span class="tag ok">-${String(d).replace('.',',')}%</span>`:''}<br><span class="num">${brl(v)}</span>${m>1?`<span class="muted"> · ${brl(v/m)}/mês</span>`:''}</button>`}).join('');
  return `<div class="panel" style="margin:14px 0 0"><b>Pagar adiantado com desconto</b><p class="muted" style="margin:4px 0 8px">Pague de uma vez por Pix ou cartão e economize. O vencimento avança pelo período escolhido.</p><div class="row-actions" style="gap:8px;flex-wrap:wrap">${bt}</div></div>`;
}
async function periodoPagar(m){
  const r=await sb.rpc('plano_cobranca_periodo',{p_meses:m});
  if(r.error){if(r.error.code==='PGRST202'||r.error.code==='42883')throw erroUi('Rode o arquivo 44-planos-periodo.sql (ou o agendio-TUDO.sql) no Supabase.');throw r.error}
  if(!r.data||r.data.ok!==true)throw erroUi((r.data&&r.data.erro)||'Não foi possível concluir.');
  await carregarSalao();abrirPagamento(r.data.id);
}
function blocoAssinatura(){
  if(S.ctx.role!=='proprietario'||!S.ctx.tenant)return '';
  const tn=S.ctx.tenant,pl=S.ctx.plano,A=S.assin||{planos:[],pags:[]};
  const venc=tn.vencimento?(tn.vencimento<hoje()?'venceu em ':'vence em ')+fd(tn.vencimento):'';
  const pags=A.pags.length?'<div class="list" style="margin-top:8px">'+A.pags.map(g=>`<div class="item"><div class="grow"><div class="t">${esc((S.ctx&&S.ctx.tenant&&S.ctx.tenant.nome)||'Meu salão')}</div><div class="muted">${g.tipo==='mensagens'?esc(g.descricao||'Mensagens de WhatsApp')+' · ':''}vence ${esc(fd(g.vencimento))}${Number(g.meses)>1?` · plano de ${Number(g.meses)} meses`:''}</div></div><div class="side"><b>${brl(g.valor)}</b> ${tagSt(g.status,ST_PAG)}${g.status==='pendente'||g.status==='atrasado'?` <button class="btn sm" data-act="pagarMP" data-id="${esc(g.id)}">Pagar agora</button>`:g.status==='pago'?` <button class="btn ghost sm" data-act="reciboPag" data-id="${esc(g.id)}">Recibo</button>`:''}</div></div>`).join('')+'</div>':'<p class="muted" style="margin:6px 0 0">Nenhuma cobrança até agora.</p>';
  const outros=A.planos.filter(p=>!pl||p.nome!==pl.nome);

function reduzLogo(file){
  return new Promise((ok,no)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const mx=256,k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
      let d=c.toDataURL('image/png');if(d.length>150000)d=c.toDataURL('image/jpeg',.85);
      d.length>190000?no(new Error('grande')):ok(d);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);no(new Error('imagem'))};
    im.src=url;
  });
}

async function fotoReduz(file){
  if(!/^image\//.test(file.type||''))throw erroUi('Escolha um arquivo de imagem (JPG, PNG ou WebP).');
  if(file.size>30*1024*1024)throw erroUi('Esta foto é muito grande (máximo 30 MB).');
  let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(_){try{bmp=await createImageBitmap(file)}catch(__){throw erroUi('Não foi possível ler esta imagem. Use JPG, PNG ou WebP.')}}
  const e=Math.min(1,1600/Math.max(bmp.width,bmp.height)),w=Math.max(1,Math.round(bmp.width*e)),h=Math.max(1,Math.round(bmp.height*e));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(bmp,0,0,w,h);if(bmp.close)bmp.close();
  let q=.82,b=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
  while(b&&b.size>2.8*1024*1024&&q>.4){q-=.15;b=await new Promise(r=>cv.toBlob(r,'image/jpeg',q))}
  if(!b)throw erroUi('Não foi possível preparar a foto.');
  return b;
}

  tag('Antes',0);tag('Depois',wa+G);

(function(){
  let des=false,tem=false;
  const ctx=cv=>{const x=cv.getContext('2d');x.lineWidth=3;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#10231d';return x};
  const pos=(cv,e)=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  document.addEventListener('pointerdown',e=>{const cv=e.target;if(!cv||cv.id!=='an-sig')return;e.preventDefault();des=true;tem=true;cv.dataset.tem='1';try{cv.setPointerCapture(e.pointerId)}catch(_){}const x=ctx(cv),p=pos(cv,e);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+.1,p[1]+.1);x.stroke()});
  document.addEventListener('pointermove',e=>{const cv=e.target;if(!des||!cv||cv.id!=='an-sig')return;const x=ctx(cv),p=pos(cv,e);x.lineTo(p[0],p[1]);x.stroke()});
  const fim=()=>{des=false};document.addEventListener('pointerup',fim);document.addEventListener('pointercancel',fim);
  window.anLimpaSig=()=>{const cv=document.getElementById('an-sig');if(!cv)return;cv.getContext('2d').clearRect(0,0,cv.width,cv.height);delete cv.dataset.tem};
})();

/* ===== Importar clientes por planilha (CSV) ===== */
function csvLer(txt){
  txt=String(txt||'').replace(/^﻿/,'');
  const prim=txt.split(/\r?\n/).find(l=>l.trim())||'';
  const del=[';','\t',','].map(d=>[d,prim.split(d).length]).sort((x,y)=>y[1]-x[1])[0][0];
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===del){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))rows.push(r);r=[]}
    else c+=ch}
  r.push(c);if(r.some(x=>x.trim()))rows.push(r);
  return rows;
}
function impData(v){
  v=String(v||'').trim();if(!v)return '';
  let m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/),d,mo,y;
  if(m){d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=y>(new Date().getFullYear()%100)?1900:2000}
  else{m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(!m)return null;y=+m[1];mo=+m[2];d=+m[3]}
  const dt=new Date(Date.UTC(y,mo-1,d));
  if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d||y<1900||y>new Date().getFullYear())return null;
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function impAnalisa(txt){
  const rows=csvLer(txt);if(!rows.length)return {erro:'A planilha está vazia.'};
  const norm=x=>nomeNorm(x);
  const h=rows[0].map(norm);
  const temCab=h.some(x=>/^(nome|cliente|nome completo)/.test(x));
  let iN=0,iT=1,iD=2,iO=-1;
  if(temCab){
    iN=h.findIndex(x=>/^(nome|cliente|nome completo)/.test(x));
    iT=h.findIndex(x=>/(telefone|celular|whats|fone|contato)/.test(x));
    iD=h.findIndex(x=>/(nasc|aniversario|data de nasc)/.test(x));
    iO=h.findIndex(x=>/^(obs|observ)/.test(x));
  }
  const dados=temCab?rows.slice(1):rows;
  if(dados.length>2000)return {erro:'Máximo de 2.000 clientes por vez. Divida a planilha em partes.'};
  const vistosFone=new Set(S.clientes.map(c=>foneNorm(c.telefone)).filter(Boolean)),vistosNome=new Set(S.clientes.map(c=>nomeNorm(c.nome)));
  const novas=[],pular=[];let semData=0;
  dados.forEach((l,i)=>{
    const lin=i+(temCab?2:1),nome=String(l[iN]||'').trim().replace(/\s+/g,' ').slice(0,80),tel=iT>=0?String(l[iT]||'').trim().slice(0,30):'';
    if(nome.length<2){pular.push({lin,nome:nome||'(sem nome)',motivo:'sem nome'});return}
    const fn=foneNorm(tel);
    if(fn&&vistosFone.has(fn)){pular.push({lin,nome,motivo:'telefone já cadastrado'});return}
    if(!fn&&vistosNome.has(nomeNorm(nome))){pular.push({lin,nome,motivo:'nome já cadastrado'});return}
    let nasc=iD>=0?impData(l[iD]):'';if(nasc===null){nasc='';semData++}
    if(fn)vistosFone.add(fn);else vistosNome.add(nomeNorm(nome));
    const o={nome,telefone:tel,nascimento:nasc||null};
    const obs=iO>=0?String(l[iO]||'').trim().slice(0,500):'';if(obs)o.obs=obs;
    novas.push(o);
  });
  return {novas,pular,semData,total:dados.length};
}

/* Agendamento recorrente: cria as próximas ocorrências (sem pagamento) e pula as datas que têm conflito. */
function datasRepetidas(data,modo,vezes){
  const L=[],[y,m,dd]=String(data).split('-').map(Number);
  for(let i=1;i<vezes;i++){
    if(modo==='7'||modo==='14'){L.push(addDia(data,(modo==='7'?7:14)*i))}
    else{const t=new Date(Date.UTC(y,m-1+i,1)),ult=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();L.push(t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')+'-'+String(Math.min(dd,ult)).padStart(2,'0'))}
  }
  return L;
}

function tagsProd(p){
  const t=[];
  if(p.estoque<0)t.push('<span class="tag late">Estoque negativo</span>');
  else if(p.estoque<=0)t.push('<span class="tag late">Sem estoque</span>');
  else if(p.minimo>0&&p.estoque<p.minimo*p.conteudo)t.push('<span class="tag late">Estoque baixo</span>');
  if(p.validade){const d=diasPara(p.validade);if(d<0)t.push('<span class="tag late">Vencido</span>');else if(d<=30)t.push(`<span class="tag late">Vence em ${d} ${d===1?'dia':'dias'}</span>`)}
  return t.join(' ');
}
function itensProdutos(){
  const b=nrm(S.estBusca||'');
  const L=S.produtos.filter(p=>(!S.estCat||p.categoria===S.estCat)&&(!b||nrm(p.nome+' '+p.categoria+' '+p.fornecedor).includes(b))).sort((x,y)=>x.nome.localeCompare(y.nome,'pt-BR'));
  if(!L.length)return '<div class="empty"><p>'+(S.produtos.length?'Nenhum produto encontrado.':'Nenhum produto cadastrado ainda. Clique em "Novo produto".')+'</p></div>';
  return '<div class="list">'+L.map(p=>`<div class="item"><div class="grow"><div class="t">${esc(p.nome)} <span class="tag">${esc(p.categoria)}</span> ${tagsProd(p)}</div>
    <div class="muted num">Estoque: ${nTxt(nEmb(p))} emb. (${nTxt(p.estoque)} ${p.unidade}) · embalagem de ${nTxt(p.conteudo)} ${p.unidade} · ${brl(p.preco)}${p.fornecedor?' · '+esc(p.fornecedor):''}</div>
    <div class="muted num">${p.uso>0?`Rende ${nTxt(aplicPorEmb(p),0)} aplicações (${nTxt(p.uso)} ${p.unidade} cada${p.perda?` + ${nTxt(p.perda)}% de perda`:''}) · custo ${brl(custoAplic(p))} por aplicação · o estoque atual dá ${nTxt(aplicRest(p),0)} aplicações`:'Informe quanto usa por aplicação para ver o rendimento e o custo.'}</div></div>

/* Lista de compras: produtos em falta ou abaixo do mínimo, por fornecedor */
function textoCompras(L){
  const g={};L.forEach(x=>{(g[x.p.fornecedor||'Sem fornecedor']=g[x.p.fornecedor||'Sem fornecedor']||[]).push(x)});
  let t='Lista de compras - '+((S.ctx&&S.ctx.tenant&&S.ctx.tenant.nome)||'Salão')+'\n';
  Object.keys(g).sort((a,b)=>a.localeCompare(b,'pt-BR')).forEach(f=>{t+='\n'+f+'\n';g[f].forEach(x=>{t+='- '+x.p.nome+': '+x.q+(x.q===1?' embalagem':' embalagens')+'\n'})});
  return t;
}
function listaCompras(){
  const L=S.produtos.filter(emFalta).map(p=>{const alvo=Math.max(1,(p.minimo||0)*2),q=Math.max(1,Math.ceil(alvo-Math.max(0,nEmb(p))-1e-9));return{p,q,custo:q*p.preco}}).sort((a,b)=>(a.p.fornecedor||'zzz').localeCompare(b.p.fornecedor||'zzz','pt-BR')||a.p.nome.localeCompare(b.p.nome,'pt-BR'));
  if(!L.length){abrir('<h2>Lista de compras</h2><p>Nada em falta agora. Os produtos com estoque abaixo do mínimo aparecem aqui.</p><div class="acts"><button type="button" class="btn" data-act="fechar">Fechar</button></div>');return}
  const tot=L.reduce((t,x)=>t+x.custo,0),txt=textoCompras(L);
  abrir(`<h2>Lista de compras</h2><p class="muted">Quantidade sugerida para chegar ao dobro do estoque mínimo (ou 1 embalagem, se não houver mínimo).</p>
  <div class="list">${L.map(x=>`<div class="item"><div class="grow"><div class="t">${esc(x.p.nome)}</div><div class="muted">${esc(x.p.fornecedor||'Sem fornecedor')} · tem ${Math.max(0,Math.round(nEmb(x.p)*100)/100)} emb.</div></div><div class="side"><b>${x.q} emb.</b><div class="muted">${brl(x.custo)}</div></div></div>`).join('')}</div>

async function salvarProd(id,d){
  const nome=(d.nome||'').trim(),cont=r3(d.conteudo);
  if(!nome)throw erroAviso('Informe o nome do produto.');
  if(!(cont>0))throw erroAviso('Informe o conteúdo da embalagem (maior que zero).');
  const o={nome,categoria:(d.categoria||'').trim()||'Outros',unidade:UN.includes(d.unidade)?d.unidade:'g',conteudo:cont,preco:din(d.preco),uso_aplicacao:r3(d.uso),
    perda:Math.min(100,Math.max(0,Math.round((Number(d.perda)||0)*100)/100)),minimo:r3(d.minimo),fornecedor:(d.fornecedor||'').trim(),validade:d.validade||null,obs:(d.obs||'').trim()};
  if(id){const r=await sb.from('produtos').update(o).eq('id',id);if(r.error)throw r.error}
  else{
    o.id=novoId();
    const r=await sb.from('produtos').insert(o);if(r.error)throw r.error;
    const ini=Number(d.inicial)||0;
    if(ini>0){const m=await sb.from('movimentacoes_estoque').insert({id:novoId(),produto_id:o.id,data:hoje(),tipo:'entrada',quantidade:r4(ini*cont),motivo:'Estoque inicial'});if(m.error)throw m.error}
  }
  await recarregar();toast(id?'Produto atualizado.':'Produto cadastrado.');
}
function pedirDelProd(id){
  const p=S.produtos.find(x=>x.id===id);if(!p)return;

/* Movimentar: entrada (compra), saída (uso/perda) e ajuste (contagem) */
function formMov(id){
  const p=S.produtos.find(x=>x.id===id);if(!p)return;
  abrir(`<h2>Movimentar estoque</h2><p class="muted">${esc(p.nome)} · estoque atual: ${nTxt(nEmb(p))} embalagens (${nTxt(p.estoque)} ${p.unidade})</p>
  <form data-form="mov" data-id="${esc(id)}"><div class="grid2">
  <div><label for="m-tipo">Tipo</label><select id="m-tipo" name="tipo"><option value="entrada">Entrada (compra)</option><option value="saida">Saída (uso ou perda)</option><option value="ajuste">Ajuste (contagem)</option></select></div>
  <div><label for="m-qtd" id="m-qtd-l">Quantidade (embalagens) *</label><input id="m-qtd" name="qtd" type="number" step="0.01" min="0" required inputmode="decimal"></div>
  <div><label for="m-data">Data</label><input id="m-data" name="data" type="date" value="${hoje()}"></div>
  <div><label for="m-mot">Motivo</label><input id="m-mot" name="motivo" maxlength="120" placeholder="Ex.: compra na distribuidora"></div></div>
  <div class="acts"><button type="button" class="btn ghost" data-act="fechar">Cancelar</button><button class="btn">Salvar</button></div></form>`);
}
async function salvarMov(id,d){
  const p=S.produtos.find(x=>x.id===id);if(!p)throw new Error('produto');
  const q=Number(d.qtd);
  if(!(q>=0)||(d.tipo!=='ajuste'&&!(q>0)))throw erroAviso('Informe uma quantidade maior que zero.');
  let delta=d.tipo==='entrada'?q*p.conteudo:d.tipo==='saida'?-q*p.conteudo:q*p.conteudo-p.estoque;
  delta=r4(delta);
  if(d.tipo==='saida'&&p.estoque+delta<-1e-6)throw erroAviso(`Saída maior que o estoque (${nTxt(nEmb(p))} embalagens). Use "Ajuste" para corrigir a contagem.`);
  if(d.tipo==='ajuste'&&delta===0)throw erroAviso('O estoque já está com essa quantidade.');
  const r=await sb.from('movimentacoes_estoque').insert({id:novoId(),produto_id:id,data:d.data||hoje(),tipo:UN.length&&['entrada','saida','ajuste'].includes(d.tipo)?d.tipo:'ajuste',quantidade:delta,motivo:(d.motivo||'').trim()});
  if(r.error)throw r.error;
  await recarregar();toast('Movimentação registrada.');
}
function histProd(id){
  const p=S.produtos.find(x=>x.id===id);if(!p)return;
  const TT={entrada:'Entrada',saida:'Saída',ajuste:'Ajuste',atendimento:'Uso em atendimento'};
  const L=S.movs.filter(m=>m.produtoId===id).sort((a,b)=>String(b.data).localeCompare(String(a.data))||String(b.id).localeCompare(String(a.id))).slice(0,100);
  abrir(`<h2>Histórico</h2><p class="muted">${esc(p.nome)} · mostrando os últimos 120 dias</p>`+(L.length?'<div class="list">'+L.map(m=>`<div class="item"><div class="grow"><div class="t">${TT[m.tipo]||esc(m.tipo)}</div><div class="muted num">${fd(m.data)}${m.motivo?' · '+esc(m.motivo):''}</div></div><div class="side num"><b>${m.quantidade>0?'+':'−'}${nTxt(Math.abs(m.quantidade)/p.conteudo)} emb.</b><div class="muted">${nTxt(Math.abs(m.quantidade))} ${p.unidade}</div></div></div>`).join('')+'</div>':'<div class="empty"><p>Sem movimentações nos últimos 120 dias.</p></div>')+`<div class="acts"><button type="button" class="btn ghost" data-act="fechar">Fechar</button></div>`);
}
/* Fichas técnicas: o que cada procedimento consome */
function telaFichas(){
  return `<p class="muted" style="font-size:13px;margin:0 0 10px">Para cada procedimento, informe quais produtos e quanto de cada um é usado por atendimento. O sistema calcula o custo real de produtos, sugere o valor ao registrar o atendimento e dá baixa no estoque.</p>`+
  procsTodas().map(proc=>{
    const it=fichaDe(proc);
    return `<div class="panel"><div class="bar" style="margin:0 0 6px"><div><b>${esc(proc)}</b> <span class="muted num">${it.length?'· custo de produtos: '+brl(custoFicha(proc)):'· sem ficha'}</span></div><button class="btn ghost sm" data-act="novaFicha" data-id="${esc(proc)}">Adicionar produto</button></div>`+
    (it.length?'<div class="list">'+it.map(({f,p})=>`<div class="item"><div class="grow"><div class="t">${esc(p.nome)}</div><div class="muted num">${nTxt(f.quantidade)} ${p.unidade} por aplicação${p.perda?` (+${nTxt(p.perda)}% de perda)`:''}</div></div><div class="side num"><b>${brl(custoUso(p,f.quantidade))}</b></div><div class="item-acts"><button class="btn ghost sm" data-act="editFicha" data-id="${esc(f.id)}">Editar</button><button class="btn danger sm" data-act="delFicha" data-id="${esc(f.id)}">Remover</button></div></div>`).join('')+'</div>':'')+'</div>';
  }).join('');
}
function formFicha(proc,id){
  if(!S.produtos.length){toast('Cadastre um produto primeiro.',true);return}
  const f=id?S.fichas.find(x=>x.id===id):null;if(id&&!f)return;
  const pr=f?f.procedimento:proc;
  abrir(`<h2>${esc(pr)}</h2><form data-form="ficha" data-id="${esc(id||'')}"><input type="hidden" name="procedimento" value="${esc(pr)}">
  <label for="f-prod">Produto *</label><select id="f-prod" name="produtoId" required><option value="">Selecione…</option>${[...S.produtos].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).map(p=>`<option value="${esc(p.id)}" ${f&&f.produtoId===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}</select>
  <label for="f-qtd">Quantidade usada por aplicação <span id="f-un" class="muted"></span> *</label><input id="f-qtd" name="quantidade" type="number" step="0.001" min="0.001" required inputmode="decimal" value="${f?esc(f.quantidade):''}">

  <div class="acts"><button type="button" class="btn ghost" data-act="fechar">Cancelar</button><button class="btn">Salvar</button></div></form>`);
  previaFicha(false);
}
function previaFicha(auto){
  const sel=$('f-prod');if(!sel)return;const p=S.produtos.find(x=>x.id===sel.value);
  $('f-un').textContent=p?'('+p.unidade+')':'';
  if(p&&auto&&!$('f-qtd').value&&p.uso>0)$('f-qtd').value=p.uso;
  const q=Number($('f-qtd').value)||0;
  $('f-prev').textContent=p&&q>0?`Custo deste produto por atendimento: ${brl(custoUso(p,q))}`:'';
}
async function salvarFicha(id,d){
  const q=r3(d.quantidade),p=S.produtos.find(x=>x.id===d.produtoId);
  if(!p)throw erroAviso('Escolha o produto.');
  if(!(q>0))throw erroAviso('Informe a quantidade usada por aplicação.');
  const igual=S.fichas.find(x=>x.procedimento===d.procedimento&&x.produtoId===d.produtoId);
  const alvo=id||(igual&&igual.id);
  if(id&&igual&&igual.id!==id)throw erroAviso('Este produto já está na ficha deste procedimento.');
  const o={procedimento:d.procedimento,produto_id:d.produtoId,quantidade:q};
  const r=alvo?await sb.from('ficha_procedimento').update(o).eq('id',alvo):await sb.from('ficha_procedimento').insert(Object.assign({id:novoId()},o));
  if(r.error)throw r.error;
  await recarregar();toast('Ficha técnica atualizada.');
}
function pedirDelFicha(id){
  confirmar('Remover este produto da ficha?','O estoque e os atendimentos já registrados não mudam.','Remover',async()=>{
    const r=await sb.from('ficha_procedimento').delete().eq('id',id);if(r.error)throw r.error;
    await recarregar();toast('Produto removido da ficha.');
  });
}

// Previsão por semana: entradas = atendimentos futuros ainda não pagos; saídas = contas a pagar em aberto (as atrasadas entram na 1ª semana)
function fluxoSemanas(n){
  const h=hoje(),sem=[];
  for(let i=0;i<n;i++)sem.push({ini:addDia(h,i*7),fim:addDia(h,i*7+6),ent:0,sai:0});
  const idx=d=>Math.max(0,Math.floor(difDias(d,h)/7));
  (S.atend||[]).filter(a=>!inativo(a)&&a.data>=h&&a.pago===false&&!isFiado(a)).forEach(a=>{const k=idx(a.data);if(k<n)sem[k].ent+=Number(a.valor)||0});
  (S.contas||[]).filter(c=>!c.pagoEm).forEach(c=>{const k=idx(c.vencimento);if(k<n)sem[k].sai+=c.valor});
  let acc=0;sem.forEach(x=>{x.saldo=x.ent-x.sai;acc+=x.saldo;x.acc=acc});
  return sem;
}

const erroUi=m=>Object.assign(new Error(m),{aviso:m});
const DIAS_SEM=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const hmin=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?(+m[1])*60+(+m[2]):null};

function avisosAgenda(d,idAtual){
  const av=[],ini=hmin(d.hora),dur=Math.min(720,Math.max(5,Math.round(Number(d.duracao)||60)));
  if(ini===null||!d.data)return av;
  const fim=ini+dur,prof=(d.profissional||'').trim();
  S.atend.filter(a=>a.id!==idAtual&&a.data===d.data&&a.hora&&(!prof||a.profissional===prof)).forEach(a=>{
    const i=hmin(a.hora);if(i!==null&&i<fim&&ini<i+(a.duracao||60)){const c=cli(a.clienteId);av.push('Já existe atendimento às '+a.hora+(c?' ('+c.nome+')':'')+(prof?' com '+prof:'')+'.')}});
  if(d.sala)S.atend.filter(a=>a.id!==idAtual&&a.data===d.data&&a.hora&&a.sala===d.sala).forEach(a=>{
    const i=hmin(a.hora);if(i!==null&&i<fim&&ini<i+(a.duracao||60)){const c=cli(a.clienteId);av.push('A sala/equipamento "'+d.sala+'" já está ocupada às '+a.hora+(c?' ('+c.nome+')':'')+'.')}});
  (S.bloq||[]).filter(b=>b.data===d.data&&(!b.profissional||!prof||b.profissional===prof)).forEach(b=>{
    const bi=b.inicio?hmin(b.inicio):0,bf=b.inicio?hmin(b.fim):1440;
    if(bi<fim&&ini<bf)av.push('Horário bloqueado'+(b.profissional?' para '+b.profissional:'')+(b.motivo?': '+b.motivo:'')+'.')});
  const hp=prof&&((S.agCfg&&S.agCfg.profissionais)||{})[prof];
  if(hp&&hp.d){
    const wd=new Date(d.data+'T12:00:00').getDay(),dia=hp.d[wd];
    if(!dia)av.push(prof+' não trabalha '+DIAS_SEM[wd].toLowerCase()+'.');
    else{
      const di=hmin(dia[0]),df=hmin(dia[1]);
      if(di!==null&&df!==null&&(ini<di||fim>df))av.push('Fora do horário de '+prof+' ('+dia[0]+' às '+dia[1]+').');
      const ai=hp.a?hmin(hp.a[0]):null,af=hp.a?hmin(hp.a[1]):null;
      if(ai!==null&&af!==null&&ai<fim&&ini<af)av.push('Cai no horário de almoço de '+prof+' ('+hp.a[0]+' às '+hp.a[1]+').');
    }
  }
  return av;
}

}

async function salvarHorarios(d){
  const profs=listaProfs(),out={};
  profs.forEach((nome,i)=>{
    const dd={};
    for(let n=0;n<7;n++){if(d[i+'_'+n+'_on']==='on'){const a=d[i+'_'+n+'_ini'],b=d[i+'_'+n+'_fim'];if(hmin(a)===null||hmin(b)===null||hmin(b)<=hmin(a))throw erroUi(nome+': confira o horário de '+DIAS_SEM[n]+' (o fim deve ser depois do início).');dd[n]=[a,b]}}
    if(!Object.keys(dd).length)return;
    const o={d:dd},ai=d[i+'_alm_ini'],af=d[i+'_alm_fim'];
    if(ai||af){if(hmin(ai)===null||hmin(af)===null||hmin(af)<=hmin(ai))throw erroUi(nome+': confira o horário de almoço.');o.a=[ai,af]}
    out[nome]=o;
  });
  await salvarAgCfg(Object.assign({},S.agCfg,{profissionais:out}));render();toast('Horários salvos.');
}

async function conectarFb(){

      if(d&&d.type==='WA_EMBEDDED_SIGNUP'){if(d.event==='FINISH'&&d.data)sess={phone_id:String(d.data.phone_number_id||''),waba_id:String(d.data.waba_id||'')};else if(d.event==='CANCEL')sess={cancel:true}}}catch(_){}

/* ---------- Gráficos (SVG simples, sem biblioteca) ---------- */
const nice=v=>{if(!(v>0))return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e};
const eixoVal=v=>v>=10000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':Math.round(v).toLocaleString('pt-BR');
const brl0=v=>'R$ '+Math.round(v).toLocaleString('pt-BR');
const mesCurto=m=>{const [y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.','')};
const colTopo=(x,y,w,h,r)=>{if(h<=0)return '';r=Math.min(r,w/2,h);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`};
function grafColunas(o){
  const W=o.W,H=212,ml=48,mr=8,mt=20,mb=28,iw=W-ml-mr,ih=H-mt-mb,n=o.cats.length,ns=o.series.length;
  const max=Math.max(1,...o.cats.flatMap(c=>c.vals)),passo=o.inteiro?Math.max(1,Math.ceil(nice(max/4))):nice(max/4),nt=Math.ceil(max/passo-1e-9),topo=passo*nt;
  const banda=iw/n,bw=Math.max(4,Math.min(24,(banda-8)/ns-2)),grupo=bw*ns+2*(ns-1),y=v=>mt+ih-v/topo*ih;
  let g='';
  for(let i=0;i<=nt;i++){const v=i*passo;g+=`<line class="vz-grid" x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}"/><text class="vz-ax" x="${ml-6}" y="${y(v)+4}" text-anchor="end">${eixoVal(v)}</text>`}
  let mi=0,mk=0;o.cats.forEach((c,i)=>c.vals.forEach((v,k)=>{if(v>o.cats[mi].vals[mk]){mi=i;mk=k}}));
  o.cats.forEach((c,i)=>{
    const bx=ml+banda*i,x0=bx+(banda-grupo)/2;
    c.vals.forEach((v,k)=>{const h=v/topo*ih;if(h>0)g+=`<path class="vz-s${k}" d="${colTopo(x0+k*(bw+2),y(v),bw,h,4)}"/>`});
    g+=`<text class="vz-ax" x="${bx+banda/2}" y="${H-9}" text-anchor="middle">${esc(c.rot)}</text>`;
    g+=`<rect class="vz-hit" x="${bx}" y="${mt}" width="${banda}" height="${ih}" data-tip="${esc(c.tip)}"/>`;
  });
  const m0=o.cats[mi],vm=m0&&m0.vals[mk];
  if(vm>0){const cx=ml+banda*mi+(banda-grupo)/2+mk*(bw+2)+bw/2,al=cx<ml+36?'start':cx>W-mr-36?'end':'middle',lx=al==='start'?cx-bw/2:al==='end'?cx+bw/2:cx;
    g+=`<text class="vz-lab" x="${lx}" y="${y(vm)-6}" text-anchor="${al}">${(o.fmt||brl0)(vm)}</text>`}
  const keys=ns>1?`<div class="vz-keys">${o.series.map((t,k)=>`<span><i class="s${k}"></i>${esc(t)}</span>`).join('')}</div>`:'';
  const tab=`<details><summary>Ver como tabela</summary><table><thead><tr><th>${esc(o.catRot||'')}</th>${o.series.map(t=>`<th>${esc(t)}</th>`).join('')}</tr></thead><tbody>${o.cats.map(c=>`<tr><td>${esc(c.nome)}</td>${c.vals.map(v=>`<td>${(o.fmt||brl)(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></details>`;
  return `<div class="panel vz"><b>${esc(o.titulo)}</b><p class="muted sub">${esc(o.sub)}</p>${keys}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.titulo)}">${g}</svg>${tab}</div>`;
}

const cxGrupo=k=>/^pix/i.test(k)?'Pix':k==='Dinheiro'?'Dinheiro':/^Cartão de (débito|crédito)/.test(k)?'Cartão':'Outros';
async function caixaCarrega(){

  try{const r=await sb.from('caixa_dias').select('*').order('data',{ascending:false}).limit(120);
    if(!r.error){S.caixaDias=r.data||[];render()}else S.caixaDias=false}catch(_){S.caixaDias=false}

function blocoCaixa(d,porForma){
  if(S.legado)return '';

  if(S.caixaDias===false)return '';
  const g={};Object.entries(porForma).forEach(([k,v])=>{const n=cxGrupo(k);g[n]=Math.round(((g[n]||0)+v)*100)/100});

  const ordem=['Dinheiro','Pix','Cartão','Outros'].filter(k=>g[k]!==undefined&&(g[k]!==0||k==='Dinheiro'));
  S.cxEsp={data:d,g,ordem};
  const rec=(S.caixaDias||[]).find(x=>x.data===d),pode=cpPode();
  const fdif=v=>v===0?'<b>bateu certinho</b>':v>0?`<b>sobrou ${brl(v)}</b>`:`<b class="neg">faltou ${brl(-v)}</b>`;
  let h=`<h3>Fechamento do caixa</h3>`;
  if(rec){
    const ks=Object.keys({...rec.esperado,...rec.contado});
    h+=`<div class="panel"><div>Caixa fechado em ${esc(fd(d))} · diferença: ${fdif(Number(rec.diferenca)||0)}</div>
    <div class="list" style="margin-top:8px">${ks.map(k=>{const e=Number((rec.esperado||{})[k])||0,c=Number((rec.contado||{})[k])||0;return `<div class="item"><div class="grow t">${esc(k)}</div><div class="muted num">esperado ${brl(e)} · contado ${brl(c)}</div></div>`}).join('')}</div>
    ${rec.obs?`<div class="muted" style="margin-top:6px">${esc(rec.obs)}</div>`:''}</div>`;

function capacidade(nome,ini,fim){

    (S.bloq||[]).filter(b=>b.data===dia&&(!b.profissional||b.profissional===nome)).forEach(b=>{oc.push(b.inicio?[hmin(b.inicio),hmin(b.fim)]:[0,1440])});
