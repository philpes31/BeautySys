<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Agendar horário</title>
<meta name="theme-color" content="#ffffff">
<style>
:root{--ac:#9b2f58;--ac-t:#fff;--bg:#faf8f7;--card:#fff;--tx:#241c20;--mu:#6d6168;--ln:#e6dfe2;--er:#a3202f;--ok:#1d6b45}
@media (prefers-color-scheme:dark){:root{--bg:#171214;--card:#221b1e;--tx:#f3ecef;--mu:#a99ca3;--ln:#3a2f34;--er:#ff8a96;--ok:#7fd3a3}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
main{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:28px 0 8px}
h1{font-size:1.6rem;line-height:1.15;margin:0;letter-spacing:-.01em}
.sub{color:var(--mu);margin:6px 0 0}
.aviso{margin:16px 0 0;padding:12px 14px;border-left:4px solid var(--ac);background:var(--card);border-radius:0 8px 8px 0;white-space:pre-line}
section{margin-top:28px}
h2{font-size:1rem;margin:0 0 10px}
.opcoes{display:grid;gap:8px}
.op{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--ln);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:48px}
.op small{color:var(--mu);display:block}
.op[aria-pressed=true]{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.preco{font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--ln);border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--ac-t)}
.dias{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.dia{flex:0 0 62px;scroll-snap-align:start;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--ln);border-radius:14px;padding:8px 0;text-align:center;cursor:pointer;min-height:68px}
.dia b{display:block;font-size:1.25rem;line-height:1.2}
.dia span{font-size:.78rem;color:var(--mu)}
.dia[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--ac-t)}
.dia[aria-pressed=true] span{color:inherit}
label{display:block;font-weight:600;margin:14px 0 4px}
input,textarea{width:100%;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--ln);border-radius:10px;padding:12px;min-height:48px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 45%,transparent);outline-offset:1px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.vazio,.leg{color:var(--mu);font-size:.92rem}
.erro{color:var(--er);margin:12px 0 0;min-height:1.4em}
.enviar{width:100%;margin-top:14px;font:inherit;font-weight:700;background:var(--ac);color:var(--ac-t);border:0;border-radius:12px;padding:14px;min-height:52px;cursor:pointer}
.enviar:disabled{opacity:.6}
.resumo{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-top:14px}
.fim{text-align:center;padding:40px 0}
.logo{width:56px;height:56px;border-radius:14px;object-fit:cover;margin-bottom:10px;display:block}
.periodo{flex-basis:100%;margin:8px 0 0;font-size:.85rem;color:var(--mu);font-weight:600}
.sinal-tag{display:inline-block;font-size:.78rem;color:var(--ac);font-weight:600;margin-top:2px}
.dica{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin:14px 0;text-align:left}
.btn2{display:inline-block;font:inherit;font-weight:700;text-decoration:none;color:var(--ac);border:1.5px solid var(--ac);border-radius:12px;padding:12px 18px;min-height:48px;background:transparent;cursor:pointer;margin:6px 4px 0}
.btn1{display:inline-block;font:inherit;font-weight:700;text-decoration:none;color:var(--ac-t);background:var(--ac);border:0;border-radius:12px;padding:13px 20px;min-height:48px;cursor:pointer;margin:6px 4px 0}
.fim h2{font-size:1.4rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<div id="app" aria-live="polite"><p class="vazio" style="padding-top:40px">Carregando…</p></div>
</main>
<script src="/config.js"></script>
<script>
(function(){
'use strict';
var C=window.SALAO_CONFIG||{},$=function(i){return document.getElementById(i)},A=$('app');
var S={salao:null,serv:null,prof:'',dia:'',hora:'',horas:[],enviando:false,carregandoH:0};
var SLUG=(function(){var m=/\/a\/([^\/?#]+)/.exec(location.pathname);if(m)return decodeURIComponent(m[1]);return new URLSearchParams(location.search).get('s')||''})().toLowerCase();
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function brl(v){return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
async function rpc(nome,args){
  var r=await fetch(C.url+'/rest/v1/rpc/'+nome,{method:'POST',headers:{'Content-Type':'application/json',apikey:C.anonKey,Authorization:'Bearer '+C.anonKey},body:JSON.stringify(args)});
  var j=null;try{j=await r.json()}catch(_){}
  if(!r.ok){var e=new Error((j&&j.message)||'Não foi possível concluir. Tente de novo.');e.aviso=(j&&j.code==='22023');throw e}
  return j;
}
function cor(hex){
  if(!/^#[0-9a-fA-F]{6}$/.test(hex||''))return;
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  var lum=(0.299*r+0.587*g+0.114*b)/255;
  document.documentElement.style.setProperty('--ac',hex);
  document.documentElement.style.setProperty('--ac-t',lum>0.6?'#1a1416':'#ffffff');
  var m=document.querySelector('meta[name=theme-color]');if(m)m.content=hex;
}
function dias(n){
  var out=[],d=new Date();
  for(var i=0;i<=n;i++){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+i);
    var iso=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
    out.push({iso:iso,n:x.getDate(),w:x.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.',''),m:x.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')})}
  return out;
}
function dataExtensa(iso){var p=iso.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}
function montar(){
  var s=S.salao;
  var profs=s.profissionais||[];
  A.innerHTML='<header>'+(/^https:\/\//.test(s.logo||'')?'<img class="logo" alt="" src="'+esc(s.logo)+'">':'')+'<h1>'+esc(s.nome)+'</h1><p class="sub">Escolha o serviço e o horário. O salão confirma o seu pedido pelo WhatsApp.</p>'+(s.aviso?'<p class="aviso">'+esc(s.aviso)+'</p>':'')+'</header>'+
  '<section aria-labelledby="h-serv"><h2 id="h-serv">Serviço</h2><div class="opcoes" id="serv">'+
    (s.servicos.length?s.servicos.map(function(x,i){return '<button type="button" class="op" data-i="'+i+'" aria-pressed="false"><span>'+esc(x.nome)+'<small>'+(Number(x.duracao)||60)+' min</small>'+(x.sinal&&x.sinal.modo!=='nenhum'?'<span class="sinal-tag">Sinal de '+brl(x.sinal.valor)+'</span>':'')+'</span>'+(Number(x.preco)>0?'<span class="preco">'+brl(x.preco)+'</span>':'')+'</button>'}).join(''):'<p class="vazio">Este salão ainda não cadastrou serviços para agendar online.</p>')+
  '</div></section>'+
  '<section id="s-prof" hidden aria-labelledby="h-prof"><h2 id="h-prof">Com quem</h2><div class="chips" id="prof"></div></section>'+
  '<section id="s-dia" hidden aria-labelledby="h-dia"><h2 id="h-dia">Dia</h2><div class="dias" id="dias" role="group" aria-labelledby="h-dia">'+dias(s.dias_max).map(function(d){return '<button type="button" class="dia" data-d="'+d.iso+'" aria-pressed="false" aria-label="'+esc(dataExtensa(d.iso))+'"><span>'+esc(d.w)+'</span><b>'+d.n+'</b><span>'+esc(d.m)+'</span></button>'}).join('')+'</div></section>'+
  '<section id="s-hora" hidden aria-labelledby="h-hora"><h2 id="h-hora">Horário</h2><p class="aviso" id="h-aviso" role="alert" hidden></p><div class="chips" id="horas"></div><p class="vazio" id="h-vazio" hidden>Sem horários livres neste dia. Escolha outro dia.</p></section>'+
  '<form id="f" hidden novalidate><section aria-labelledby="h-eu"><h2 id="h-eu">Seus dados</h2>'+
  '<div class="resumo" id="resumo"></div>'+
  '<label for="nome">Nome</label><input id="nome" autocomplete="name" maxlength="80" required>'+
  '<label for="tel">WhatsApp com DDD</label><input id="tel" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="(11) 90000-0000" required>'+
  '<label for="obs">Recado (opcional)</label><textarea id="obs" rows="2" maxlength="200"></textarea>'+
  '<input class="hp" id="site" tabindex="-1" autocomplete="off" aria-hidden="true">'+
  '<p class="leg">Usamos seu nome e telefone só para este agendamento. Ao enviar, você concorda com isso.</p>'+
  '<p class="erro" id="erro" role="alert"></p><button class="enviar" id="env">Enviar pedido</button></section></form>';
}
function resumo(){
  var x=S.salao.servicos[S.serv];
  $('resumo').innerHTML='<b>'+esc(x.nome)+'</b><br>'+esc(dataExtensa(S.dia))+' às '+esc(S.hora)+(S.prof?' · com '+esc(S.prof):'')+(x.sinal&&x.sinal.modo==='mp'?'<br><span class="sinal-tag">Para garantir o horário, pague o sinal de '+brl(x.sinal.valor)+' no próximo passo.</span>':x.sinal&&x.sinal.modo==='pix'?'<br><span class="sinal-tag">Sinal de '+brl(x.sinal.valor)+' por Pix (instruções no fim).</span>':'');
}
async function carregarHoras(){
  var tk=++S.carregandoH;
  S.hora='';$('f').hidden=true;
  var box=$('horas');box.innerHTML='<span class="vazio">Buscando horários…</span>';$('h-vazio').hidden=true;
  try{
    var r=await rpc('publico_horarios',{p_slug:SLUG,p_servico:S.salao.servicos[S.serv].nome,p_data:S.dia,p_prof:S.prof});
    if(tk!==S.carregandoH)return;
    var vistos={},lista=[];(r||[]).forEach(function(x){if(!vistos[x.h]){vistos[x.h]=1;lista.push(x)}});
    var gr=[['Manhã',0,12],['Tarde',12,18],['Noite',18,24]],h='';
    gr.forEach(function(g){var l=lista.filter(function(x){var n=parseInt(x.h,10);return n>=g[1]&&n<g[2]});if(l.length)h+='<p class="periodo">'+g[0]+'</p>'+l.map(function(x){return '<button type="button" class="chip" data-h="'+esc(x.h)+'" aria-pressed="false">'+esc(x.h)+'</button>'}).join('')});
    box.innerHTML=h;
    $('h-vazio').hidden=lista.length>0;
  }catch(e){if(tk===S.carregandoH){box.innerHTML='';$('h-vazio').hidden=false;$('h-vazio').textContent=e.message}}
}
function marcar(sel,attr,val){Array.prototype.forEach.call(document.querySelectorAll(sel),function(b){b.setAttribute('aria-pressed',String(b.getAttribute(attr)===String(val)))})}
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||!S.salao)return;
  if(b.classList.contains('op')){
    S.serv=Number(b.dataset.i);marcar('.op','data-i',S.serv);
    var ps=S.salao.profissionais||[];
    $('s-prof').hidden=ps.length<2;
    if(ps.length>=2){$('prof').innerHTML=['']. concat(ps).map(function(p){return '<button type="button" class="chip" data-p="'+esc(p)+'" aria-pressed="'+(p===S.prof)+'">'+(p?esc(p):'Qualquer uma')+'</button>'}).join('')}
    else S.prof='';
    $('s-dia').hidden=false;
    if(S.dia){$('s-hora').hidden=false;carregarHoras()}
  }else if(b.dataset.p!==undefined&&b.classList.contains('chip')&&b.closest('#prof')){
    S.prof=b.dataset.p;marcar('#prof .chip','data-p',S.prof);if(S.dia)carregarHoras();
  }else if(b.classList.contains('dia')){
    $('h-aviso').hidden=true;S.dia=b.dataset.d;marcar('.dia','data-d',S.dia);$('s-hora').hidden=false;carregarHoras();
    $('s-hora').scrollIntoView({behavior:'smooth',block:'nearest'});
  }else if(b.dataset.h&&b.closest('#horas')){
    S.hora=b.dataset.h;marcar('#horas .chip','data-h',S.hora);resumo();$('f').hidden=false;
    $('f').scrollIntoView({behavior:'smooth',block:'nearest'});
  }
});
document.addEventListener('submit',async function(e){
  if(e.target.id!=='f')return;e.preventDefault();
  if(S.enviando)return;
  var er=$('erro');er.textContent='';
  var nome=$('nome').value.trim(),tel=$('tel').value.replace(/\D/g,'');
  if(nome.length<2){er.textContent='Informe seu nome.';$('nome').focus();return}
  if(tel.length<10||tel.length>13){er.textContent='Informe o WhatsApp com DDD.';$('tel').focus();return}
  if($('site').value){S.enviando=true;fim(nome);return}
  S.enviando=true;$('env').disabled=true;
  try{
    var r=await rpc('publico_agendar',{p_slug:SLUG,p:{nome:nome,telefone:tel,servico:S.salao.servicos[S.serv].nome,profissional:S.prof,data:S.dia,hora:S.hora,obs:$('obs').value.trim()}});
    S.res=r||{};
    if(S.res.sinal_modo==='mp'&&S.res.pedido_id){
      er.textContent='';$('env').textContent='Abrindo o pagamento…';
      try{var u=await pagarSinal(S.res.pedido_id);location.href=u;return}
      catch(pe){fim(nome,pe.message)}
    }else fim(nome);
  }catch(x){
    er.textContent=/fetch|network|failed/i.test(x.message)?'Sem conexão. Verifique a internet e tente de novo.':x.message;
    S.enviando=false;$('env').disabled=false;
    if(/ocupado/i.test(x.message)){carregarHoras();var av=$('h-aviso');av.textContent=x.message;av.hidden=false;av.scrollIntoView({block:'center'})}
  }
});
async function pagarSinal(id){
  var r=await fetch('/api/sinal-criar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pedido_id:id})});
  var j=null;try{j=await r.json()}catch(_){}
  if(!r.ok||!j||!j.url){throw new Error((j&&j.erro)||'Não foi possível abrir o pagamento agora.')}
  return j.url;
}
function zap(texto){
  var w=String((S.salao&&S.salao.whatsapp)||(S.res&&S.res.whatsapp)||'').replace(/\D/g,'').replace(/^55/,'');
  return w.length>=10?'<a class="btn2" target="_blank" rel="noopener" href="https://wa.me/55'+w+'?text='+encodeURIComponent(texto||'Olá! Acabei de fazer um pedido de agendamento.')+'">Falar no WhatsApp</a>':'';
}
function fim(nome,erroPag){
  var x=S.salao.servicos[S.serv],r=S.res||{};
  var sinal=r.sinal_modo==='pix'&&r.sinal_valor?'<div class="dica"><b>Sinal de '+brl(r.sinal_valor)+'</b><br>Para garantir o horário, pague o sinal conforme o recado abaixo e avise o salão.</div>':'';
  var falha=erroPag?'<div class="dica"><b>O pagamento do sinal não abriu.</b><br>'+esc(erroPag)+'</div><button class="btn1" id="repagar" type="button">Tentar pagar o sinal de novo</button>':'';
  A.innerHTML='<div class="fim"><h2>Pedido enviado, '+esc(nome.split(' ')[0])+'.</h2><p>'+esc(x.nome)+' em '+esc(dataExtensa(S.dia))+' às '+esc(S.hora)+'.</p><p class="sub">O horário fica reservado para você. O salão vai confirmar pelo WhatsApp.</p>'+sinal+falha+(S.salao.aviso?'<p class="aviso" style="text-align:left">'+esc(S.salao.aviso)+'</p>':'')+'<p>'+zap('Olá! Fiz um pedido de '+x.nome+' para '+dataExtensa(S.dia)+' às '+S.hora+'.')+'</p></div>';
  var b=$('repagar');if(b)b.onclick=async function(){b.disabled=true;try{location.href=await pagarSinal(r.pedido_id)}catch(e){b.disabled=false;b.textContent=e.message}};
  window.scrollTo(0,0);
}
// Volta do Mercado Pago: confirma o pagamento do sinal
async function retorno(id,sit){
  A.innerHTML='<div class="fim"><h2>Confirmando o pagamento…</h2><p class="sub">Isso leva alguns segundos.</p></div>';
  var st=null;
  for(var i=0;i<8;i++){
    try{st=await rpc('publico_pedido_status',{p_id:id})}catch(_){st=null}
    if(st&&st.sinal_status==='pago')break;
    if(sit==='falha')break;
    await new Promise(function(r){setTimeout(r,2500)});
  }
  var n=S.salao.nome;
  if(st&&st.sinal_status==='pago'){
    A.innerHTML='<div class="fim"><h2>Sinal recebido!</h2><p>Seu horário em '+esc(n)+' está garantido. O salão vai confirmar pelo WhatsApp.</p><p>'+zap()+'</p></div>';
  }else if(st&&(st.sinal_status==='expirado'||st.status==='recusado')){
    A.innerHTML='<div class="fim"><h2>O tempo do pedido acabou</h2><p class="sub">O horário foi liberado. Escolha outro e faça um novo pedido.</p><p><a class="btn1" href="'+location.pathname+'">Agendar de novo</a></p><p>'+zap()+'</p></div>';
  }else{
    A.innerHTML='<div class="fim"><h2>'+(sit==='falha'?'O pagamento não foi concluído':'Ainda não recebemos o pagamento')+'</h2><p class="sub">Se você já pagou, aguarde um instante: o salão será avisado assim que o Mercado Pago confirmar. Se não pagou, o horário fica reservado por pouco tempo.</p>'+
      '<p><button class="btn1" id="repagar" type="button">Pagar o sinal agora</button> '+zap()+'</p></div>';
    var b=$('repagar');b.onclick=async function(){b.disabled=true;try{location.href=await pagarSinal(id)}catch(e){b.disabled=false;b.textContent=e.message}};
  }
}
async function iniciar(){
  if(!C.url||!C.anonKey||!SLUG){A.innerHTML='<p class="vazio" style="padding-top:40px">Endereço de agendamento inválido.</p>';return}
  try{
    var s=await rpc('publico_salao',{p_slug:SLUG});
    if(!s){A.innerHTML='<header><h1>Agendamento indisponível</h1><p class="sub">Este salão não está recebendo pedidos online agora. Fale diretamente com o salão.</p></header>';return}
    S.salao=s;document.title='Agendar · '+s.nome;cor(s.cor);
    var q=new URLSearchParams(location.search),pid=q.get('p');
    if(pid&&/^[0-9a-f-]{30,40}$/i.test(pid)&&q.get('sinal')){retorno(pid,q.get('sinal'));return}
    montar();
  }catch(e){A.innerHTML='<p class="vazio" style="padding-top:40px">Não foi possível carregar. Verifique a internet e recarregue a página.</p>'}
}
iniciar();
})();
</script>
</body>
</html>
