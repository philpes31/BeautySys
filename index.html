<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agendio">
<meta name="robots" content="noindex,nofollow">
<title>Agendio</title>
<meta name="theme-color" content="#2a1722">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400..800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
/* Visual "ateliê de cor": menu lateral ameixa, fundo pérola, títulos em serifa e a carta de tons de cabelo como assinatura. */
:root{
  color-scheme:light;
  --bg:#f5f1f3;--surface:#ffffff;--ink:#27191f;--muted:#716068;--line:#e7dde2;--line-2:#f0e8ec;
  --accent:#9b2f58;--accent-hover:#832649;--accent-ink:#ffffff;--accent-soft:#f6e7ee;
  --side:#2a1722;--side-ink:#f3e8ee;--side-muted:#b9a3af;--side-hover:rgba(255,255,255,.07);--side-on:rgba(255,255,255,.12);
  --gold:#c9a46c;--viz-1:#9b2f58;--viz-2:#2a78d6;
  --ok:#23704b;--ok-soft:#e0f1e8;--warn:#b0322a;--warn-soft:#fbe6e3;--amber:#8a5a00;--amber-soft:#fcefd2;
  --font-display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 2px rgba(42,23,34,.05),0 6px 20px -12px rgba(42,23,34,.18);
  --tons:linear-gradient(90deg,#1d1411 0 11.11%,#3a2418 0 22.22%,#5b3a22 0 33.33%,#7e5532 0 44.44%,#a57a48 0 55.55%,#c99f66 0 66.66%,#e0bf86 0 77.77%,#efd8ab 0 88.88%,#f6e8cd 0 100%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161017;--surface:#211a20;--ink:#f3eaef;--muted:#ab9aa3;--line:#372c33;--line-2:#2b2229;
    --accent:#e47aa4;--accent-hover:#ee93b7;--accent-ink:#2a1119;--accent-soft:#3a2530;
    --side:#1a0f16;--viz-1:#d9628f;--viz-2:#3987e5;--ok:#6fcf9b;--ok-soft:#1f3329;--warn:#ff8f82;--warn-soft:#3d2320;--amber:#f0c26b;--amber-soft:#3a2d12;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161017;--surface:#211a20;--ink:#f3eaef;--muted:#ab9aa3;--line:#372c33;--line-2:#2b2229;
  --accent:#e47aa4;--accent-hover:#ee93b7;--accent-ink:#2a1119;--accent-soft:#3a2530;
  --side:#1a0f16;--viz-1:#d9628f;--viz-2:#3987e5;--ok:#6fcf9b;--ok-soft:#1f3329;--warn:#ff8f82;--warn-soft:#3d2320;--amber:#f0c26b;--amber-soft:#3a2d12;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,.stat b,.side b,.side-val{font-variant-numeric:tabular-nums}

/* Cabeçalho (celular) e menu lateral (computador) */
.top{position:sticky;top:0;z-index:20;background:var(--side);color:var(--side-ink)}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;padding-block:12px 4px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:21px;line-height:1.1;letter-spacing:.005em}
.brand-name span{margin-left:.25em}
.mono{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#2a1722;font-family:var(--font-display);font-size:16px;letter-spacing:0}
.tone{height:4px;border-radius:2px;background:var(--tons);margin:6px 0 2px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--side-muted)}
.sync .linkbtn{color:var(--side-ink);text-decoration:underline;text-underline-offset:3px}
.who{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--side-muted)}
.dot.on{background:#5fd39a}.dot.off{background:#ff8f82}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px 10px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:8px 13px;border-radius:99px;font:inherit;font-weight:500;color:var(--side-muted);white-space:nowrap;cursor:pointer}
.tabs button:hover{background:var(--side-hover);color:var(--side-ink)}
.tabs button[aria-current="page"]{background:var(--side-on);color:#fff;font-weight:600}
.ic{width:18px;height:18px;flex:none}

main.wrap{padding-block:20px 72px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;margin:2px 0 18px}
h1{font-family:var(--font-display);font-weight:400;font-size:32px;line-height:1.1;letter-spacing:-.005em;margin:0}
.page-head p{margin:4px 0 0;font-size:14px}
.page-head .hoje{font-size:13px}
h2{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.15;margin:4px 0 12px;text-wrap:balance}
h3{font-family:var(--font-body);font-weight:700;font-size:14px;color:var(--ink);margin:26px 0 10px;letter-spacing:.005em}
.muted{color:var(--muted)}

/* Campos e botões */
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar>input,.bar>select{flex:1 1 200px;min-width:0}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink);transition:border-color .12s,box-shadow .12s}
input:hover,select:hover,textarea:hover{border-color:#cdbcc5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.btn.danger{background:transparent;color:var(--warn);border-color:transparent}
.btn.danger:hover{background:var(--warn-soft);border-color:var(--warn-soft)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--accent);cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
a.wa{color:var(--ok);font-weight:600;text-decoration:none}
a.btn{text-decoration:none;display:inline-block;text-align:center}
a.btn.wa-btn{background:var(--ok);border-color:var(--ok);color:#fff}
a.btn.wa-btn:hover{filter:brightness(1.08)}
a.btn.wa-btn.ghost{background:transparent;color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
a.btn.wa-btn.ghost:hover{background:var(--ok-soft);color:var(--ok)}
label.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:600;color:var(--ink)}
label.chk input{width:auto}

/* Listas */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line-2)}
.item:first-child{border-top:0}
.item.click{cursor:pointer;transition:background .12s}
.item.click:hover{background:var(--accent-soft)}
.grow{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.t{font-weight:650;font-size:15.5px}
.grow .muted{font-size:13.5px}
.side{text-align:right;font-size:13px;color:var(--muted);line-height:1.4}
.side b{display:block;font-size:16px;color:var(--ink);font-weight:650}
.side-val{font-size:17px;font-weight:700;white-space:nowrap}
.item-acts{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.obs{margin-top:4px;overflow-wrap:anywhere;font-size:14px}
.av{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;font-weight:700;font-size:14px;letter-spacing:.01em}
.item .av{margin-right:2px}
.chthread{max-height:42vh;overflow:auto;margin:10px 0}.chm{padding:10px 12px;border-radius:12px;margin:8px 0;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--line-2)}.chm.suporte{background:var(--accent-soft);margin-left:auto}.chm b{font-size:13px}
#tabs button[data-n]::after,.segs button[data-n]::after{content:attr(data-n);margin-left:8px;background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:16px}
.cal-h{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:4px 0}
.cal-d{all:unset;box-sizing:border-box;cursor:pointer;min-height:112px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden}
.cal-d:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cal-d.fora{opacity:.45}.cal-d.hoje .n{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px}
.cal-d.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cal-d .n{font-weight:600;font-size:14px;align-self:flex-start}
.cal-d .c{position:absolute;top:6px;right:6px;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:0 7px}
.cal-d .chips i{display:block;font-style:normal;font-size:11px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.cal-d .bl{font-size:10px;color:var(--muted);border-top:1px dashed var(--line);margin-top:auto}
.cal-det{margin-top:6px}
.dia-lista{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}.dia-lista.hoje{border-color:var(--accent)}.dl-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dia-lista .list{margin-top:8px}
@media(max-width:640px){.cal{gap:3px}.cal-d{min-height:54px;padding:4px;align-items:center}.cal-d .chips{display:none}.cal-d .c{position:static;margin-top:auto}.cal-d .bl{display:none}.cal-d .n{align-self:center}}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:650;background:var(--line-2);color:var(--muted);vertical-align:1px}
.tag.late{background:var(--amber-soft);color:var(--amber)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}

/* Resumos */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:18px}
.stat{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat span{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.3}
.stat b{display:block;font-size:25px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.stat b.neg,.side b.neg{color:var(--warn)}
.barv{height:6px;background:var(--line-2);border-radius:99px;margin-top:8px}
.barv i{display:block;height:100%;background:var(--accent);border-radius:99px}
.empty{background:var(--surface);border:1px dashed #d8c8d0;border-radius:14px;padding:30px 22px}
.empty h2{font-size:24px}
.empty p{margin:0 0 14px;color:var(--muted);max-width:52ch}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.head-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
.head-card h2{margin:0 0 4px;font-size:30px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel p{margin:0 0 12px}
.seg{display:inline-flex;gap:2px;padding:3px;margin:0 0 16px;background:var(--line-2);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.seg .btn{border:0;border-radius:9px;background:transparent;color:var(--muted);padding:7px 14px}
.seg .btn:hover{background:transparent;color:var(--ink)}
.seg .btn:not(.ghost){background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(42,23,34,.14)}

/* Entrada */
body:not(.logado) .top{display:none}
body:not(.logado) main.wrap{max-width:none;padding:0}
.auth-links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:18px;font-size:14px}
.ok-msg{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--ok-bg,#e8f3ea);color:var(--ok-ink,#1f5a2e);font-size:14px}
.faixa{margin:0 0 14px;padding:9px 12px;border-radius:10px;background:var(--gold-soft,#f7ecd6);color:var(--ink,#2a1722);font-size:13px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.erro{color:var(--warn);min-height:1.3em;margin:10px 0 0;font-weight:500}
.entrada{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.entrada-marca{position:relative;overflow:hidden;color:var(--side-ink);padding:36px clamp(28px,5vw,76px);display:grid;grid-template-rows:auto 1fr auto;gap:28px;
  background:radial-gradient(110% 70% at 0% 0%,#43253a 0,#2a1722 48%,#1b0e16 100%)}
.entrada-marca::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:var(--tons);opacity:.9}
.marca-topo{display:flex;align-items:center;gap:11px;font-family:var(--font-display);font-size:26px;line-height:1;color:#fff}
.marca-topo .mono{width:36px;height:36px;font-size:17px}
.marca-meio{align-self:center;max-width:520px}
.entrada-marca h1{font-size:clamp(38px,4.4vw,60px);line-height:1.03;color:#fff;margin:0 0 16px;text-wrap:balance}
.marca-meio>p{margin:0 0 34px;max-width:40ch;color:var(--side-muted);font-size:17px;line-height:1.55}
.amostra{margin:0;max-width:430px;padding:16px 18px 8px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.amostra figcaption{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:12px;color:var(--side-muted)}
.amostra figcaption b{color:#fff;font-weight:650}
.am-linha{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}
.am-hora{padding-top:9px;font-size:12.5px;color:var(--side-muted);font-variant-numeric:tabular-nums}
.am-bloco{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:10px;color:#241510;font-size:14px;font-weight:650}
.am-bloco small{font-weight:550;opacity:.72;white-space:nowrap}
.am-livre{align-items:center;border:1px dashed rgba(255,255,255,.22);background:transparent;color:var(--side-muted);font-weight:500}
.marca-pe{margin:0;max-width:46ch;font-size:13px;color:var(--side-muted)}
.entrada>.login-lado{display:grid;align-items:center;justify-items:center;padding:32px 20px;background:var(--bg)}
.login{width:min(420px,100%);padding:34px 32px 30px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow),0 30px 60px -40px rgba(42,23,34,.35)}
.entrada.longo .login-lado{align-items:start}
.login h2{margin:0 0 4px;font-size:32px}
.login>p.muted{margin:0 0 6px}
.login .btn{width:100%;min-height:46px;padding:12px 16px;margin-top:8px;font-size:15.5px}
.login .acts{margin-top:10px}
.login .auth-links{justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--line-2)}
.pw{position:relative}
.pw input[type=password],.pw input[type=text]{padding-right:84px}
.pw .ver-chk{position:absolute;right:6px;top:50%;width:70px;height:34px;margin:-17px 0 0;opacity:0;cursor:pointer;z-index:2}
.pw .ver{position:absolute;right:6px;top:50%;transform:translateY(-50%);margin:0;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:650;color:var(--accent);pointer-events:none}
.pw .ver-chk:hover+.ver{background:var(--accent-soft)}
.pw .ver-chk:focus-visible+.ver{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:860px){
  .entrada{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .entrada-marca{padding:20px 22px 24px;gap:10px;grid-template-rows:auto auto}
  .marca-meio{max-width:none}
  .entrada-marca h1{font-size:28px;margin:0}
  .marca-meio>p,.amostra,.marca-pe{display:none}
  .entrada>.login-lado{padding:20px 16px 32px;align-items:start}
  .login{padding:26px 22px 24px}
}

/* Janelas, avisos */
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(560px,calc(100vw - 32px));max-height:90dvh;overflow:auto;box-shadow:0 24px 60px -20px rgba(20,8,16,.5)}
dialog::backdrop{background:rgba(26,12,20,.58);backdrop-filter:blur(2px)}
dialog h2{margin-top:0;font-size:28px}
.hr-linha{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}.hr-linha .chk{min-width:112px;margin:0}.hr-linha input[type=time]{width:auto;min-width:104px}
.slots{display:flex;flex-wrap:wrap;gap:8px}.slot{border:1px solid var(--line);background:var(--surface);color:inherit;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;min-width:72px}.slot:hover{border-color:var(--accent)}.slot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid2>div{min-width:0}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}
#toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;padding:0 max(16px,env(safe-area-inset-left,0px)) 18px;z-index:40}
.toast-in{background:var(--side);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;max-width:100%;box-shadow:0 10px 30px -10px rgba(20,8,16,.5)}
.toast-in.err{background:var(--warn);color:#fff}
/* Gráficos */
.vz .sub{margin:2px 0 10px;font-size:13px}
.vz svg{display:block;width:100%;height:auto;overflow:visible}
.vz-grid{stroke:var(--line);stroke-width:1}
.vz-ax{fill:var(--muted);font-size:11px;font-family:inherit;font-variant-numeric:tabular-nums}
.vz-lab{fill:var(--ink);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.vz-s0{fill:var(--viz-1)}.vz-s1{fill:var(--viz-2)}
.vz-hit{fill:transparent}.vz-hit:hover{fill:var(--ink);fill-opacity:.05}

  const m=Object.assign({},comissoes()),v=Math.min(100,Math.max(0,Math.round((Number(String(pct).replace(',','.'))||0)*100)/100));
  if(v>0)m[prof]=v;else delete m[prof];
  if(!S.legado&&!S.semCom){
    const r=await sb.from('tenants').update({comissoes:m}).eq('id',S.ctx.tenant.id);
    if(r.error){if(/comissoes/i.test(String(r.error.message||''))){S.semCom=true}else throw r.error}
    else{S.com=m;render();toast('Comissão salva.');return}
  }
  LS.set('salao_comissoes',JSON.stringify(m));S.com=null;render();
  toast(S.semCom?'Salvo só neste aparelho. Rode o 09-comissoes.sql no Supabase para valer em todos.':'Comissão salva.');

function msgAuth(m,st){
  m=String(m||'');
  if(st===429||/rate limit|too many/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(/already registered|already been registered/i.test(m))return 'Este e-mail já tem cadastro. Entre ou recupere a senha.';
  if(/password.*(least|short|weak)|weak password/i.test(m))return 'Escolha uma senha mais forte (8 caracteres ou mais).';
  if(/signups? (not allowed|disabled)/i.test(m))return 'O cadastro de novas contas está desativado.';
  if(/invalid.*email|email.*invalid|unable to validate email/i.test(m))return 'Confira o e-mail digitado.';
  if(/same password|different from the old/i.test(m))return 'A nova senha precisa ser diferente da atual.';
  if(/session|jwt|not authenticated|auth session missing/i.test(m))return 'O link expirou. Peça um novo em "Esqueci a senha".';
  return 'Não foi possível concluir. Tente de novo.';
}

async function pagarCobranca(id,btn){
  if(btn){btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent='Abrindo…'}
  const volta=()=>{if(btn){btn.disabled=false;btn.textContent=btn.dataset.t||'Pagar agora'}};
  const g=((S.assin&&S.assin.pags)||[]).find(x=>x.id===id);
  try{
    const ses=await sb.auth.getSession(),tk=ses&&ses.data&&ses.data.session&&ses.data.session.access_token;
    if(!tk)throw new Error('Entre de novo para pagar.');
    const r=await fetch('/api/mp-criar',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk},body:JSON.stringify({pagamento_id:id})});
    let j=null;try{j=await r.json()}catch(_){}
    if(r.ok&&j&&/^https:\/\//.test(j.url||'')){location.href=j.url;return}
    if(g&&/^https:\/\//.test(g.link_pagamento||'')){window.open(g.link_pagamento,'_blank','noopener');volta();return}
    const cod=r.status;
    if(j&&j.erro)throw new Error(j.erro+(Array.isArray(j.faltando)&&j.faltando.length?' (falta configurar: '+j.faltando.join(', ')+')':''));
    throw new Error(cod===404?'As funções de pagamento não estão publicadas no site (pasta "api" ausente na Vercel). Avise o suporte. [404]':'O pagamento online não respondeu. Tente de novo em instantes; se continuar, avise o suporte. ['+cod+']');
  }catch(x){volta();toast((x&&x.message)||'Não foi possível abrir o pagamento.',true)}
}

async function chamaAssinar(acao,btn){
  if(btn){btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent='Aguarde…'}
  const volta=()=>{if(btn){btn.disabled=false;btn.textContent=btn.dataset.t||'Ativar débito automático'}};
  try{
    const ses=await sb.auth.getSession(),tk=ses&&ses.data&&ses.data.session&&ses.data.session.access_token;
    if(!tk)throw new Error('Entre de novo para continuar.');
    const r=await fetch('/api/mp-assinar',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk},body:JSON.stringify({acao})});

    if(j&&j.erro)throw new Error(j.erro+(Array.isArray(j.faltando)&&j.faltando.length?' (falta configurar: '+j.faltando.join(', ')+')':''));

function reduzLogo(file){
  return new Promise((ok,no)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const mx=256,k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
      let d=c.toDataURL('image/png');if(d.length>150000)d=c.toDataURL('image/jpeg',.85);
      d.length>190000?no(new Error('grande')):ok(d);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);no(new Error('imagem'))};
    im.src=url;
  });
}

  const r=await sb.rpc('abrir_chamado',{p:{categoria:d.categoria,assunto:d.assunto,texto:d.texto,contexto:ctx}});
  if(r.error)throw r.error;
  await carregarAjuda();toast('Chamado enviado. Avisamos aqui quando houver resposta.');
}

/* ---------- Métricas da plataforma ---------- */
async function carregarMetricas(forca){
  if(!ehAdmin())return;
  if(forca){S.pl.met=null;S.pl.metErro=false;render()}
  try{const r=await sb.rpc('plataforma_metricas');if(r.error)throw r.error;S.pl.met=r.data;S.pl.metErro=false}
  catch(_){S.pl.metErro=true}
  if(S.view==='plataforma'&&S.pl.aba==='metricas')render();
}

  const m=S.pl.met;if(!m)return '<p class="muted">Carregando…</p>';
  const i=S.pl.ind||{},k=(v,l)=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`,at=m.atrasados||{},on=m.online_30d||{},wa=m.whatsapp_30d||{},ch=m.chamados||{},au=m.assinaturas_auto||{};

  const rec=(m.recebido_mes||[]).map(x=>({rot:mesCurto(x.mes),nome:mesNome(x.mes),vals:[Number(x.valor)],tip:mesNome(x.mes)+'\nRecebido: '+brl(x.valor)}));

  <div class="stats">${k(m.novos_30d||0,'salões novos em 30 dias')}${k(m.cancelados_30d||0,'cancelamentos em 30 dias')}${k(ch.abertos||0,'chamados abertos ('+(ch.sem_resposta||0)+' sem resposta)')}${k(on.pedidos||0,'pedidos online em 30 dias ('+taxa+' aceitos)')}</div>

  <div class="panel" style="margin-bottom:12px"><b>Testes acabando (7 dias)</b>${lista(m.testes_vencendo,x=>item(x,'termina em '+esc(fd(x.vencimento)),x.dias===0?'hoje':x.dias+' dia'+(x.dias===1?'':'s')),'Nenhum teste termina nesta semana.')}</div>
  <div class="panel" style="margin-bottom:12px"><b>Maiores atrasos</b>${lista(m.maiores_atrasos,x=>item(x,'venceu em '+esc(fd(x.vencimento)),'<b>'+brl(x.valor)+'</b>'),'Ninguém em atraso.')}</div>
  <div class="panel" style="margin-bottom:12px"><b>Salões parados (sem atendimentos há 30 dias)</b>${lista(m.saloes_parados,x=>item(x,x.ultimo?'último atendimento em '+esc(fd(x.ultimo)):'nunca registrou atendimento',tagSt(x.status,ST_SAL)),'Todos os salões registraram atendimentos.')}</div>
  <div class="panel" style="margin-bottom:12px"><b>Receita por plano</b>${lista(m.por_plano,x=>`<div class="item"><div class="grow"><div class="t">${esc(x.nome)}</div><div class="muted">${x.saloes} salão${x.saloes===1?'':'es'} ativo${x.saloes===1?'':'s'}</div></div><div class="side"><b>${brl(x.mrr)}</b></div></div>`,'Nenhum plano cadastrado.')}</div>

/* ---------- Plataforma (administrador do SaaS) ---------- */
const ST_SAL={teste:'Em teste',ativa:'Ativa',vencida:'Vencida',cancelada:'Cancelada',bloqueada:'Bloqueada'};
const ST_PAG={pendente:'Pendente',pago:'Pago',atrasado:'Atrasado',cancelado:'Cancelado'};
const tagSt=(st,lab)=>`<span class="tag${/vencida|atrasado|bloqueada|cancelada|cancelado/.test(st)?' late':''}">${esc(lab[st]||st)}</span>`;
async function carregarPlataforma(){
  if(!ehAdmin())return;
  try{
    const q=(n,a)=>sb.rpc(n,a);
    const [i,sl,cr,pl,pg,lg]=await Promise.all([q('plataforma_indicadores'),q('plataforma_saloes'),q('plataforma_crescimento'),
      sb.from('plans').select('*').order('preco_mensal'),sb.from('pagamentos').select('*').order('vencimento',{ascending:false}).limit(300),
      sb.from('audit_logs').select('*').order('criado_em',{ascending:false}).limit(300)]);
    const e=[i,sl,cr,pl,pg,lg].find(x=>x.error);if(e)throw e.error;
    S.pl=Object.assign(S.pl,{ok:true,erro:false,ind:i.data,saloes:sl.data||[],cresc:cr.data||[],planos:pl.data||[],pags:pg.data||[],logs:lg.data||[]});
  }catch(_){S.pl.erro=true;S.pl.ok=true}
  if(S.view==='plataforma')render();
}
function headPlataforma(){return `<div class="page-head"><div><h1>Plataforma</h1><p class="muted">Salões, assinaturas e pagamentos do Agendio</p></div></div>`}
const nomeSalao=id=>{const s=S.pl.saloes.find(x=>x.id===id);return s?s.nome:'—'};
function telaPlataforma(){

  const ab=S.pl.aba,A=[['painel','Painel'],['metricas','Métricas'],['saloes','Salões'],['planos','Planos'],['pagamentos','Pagamentos'],['suporte','Suporte'],['auditoria','Auditoria']];
  const nav=`<div class="segs" role="tablist">${A.map(([k,l])=>`<button class="btn ghost sm" role="tab" aria-pressed="${ab===k}" data-act="plAba" data-id="${k}"${k==='suporte'&&S.pl.pend?` data-n="${S.pl.pend}"`:''}>${l}</button>`).join('')}</div>`;
  return nav+(ab==='saloes'?plSaloes():ab==='planos'?plPlanos():ab==='pagamentos'?plPagamentos():ab==='metricas'?plMetricas():ab==='suporte'?plSuporte():ab==='auditoria'?plAuditoria():plPainel());

function plPainel(){

function plDiag(){
  const d=S.pl.diag;let corpo='<p class="muted" style="margin:4px 0 8px">Confere se o servidor do site (pasta api na Vercel), o Supabase e o Mercado Pago estão conversando. Use quando o pagamento online não abrir.</p>';
  if(d==='carregando')corpo+='<p class="muted">Testando…</p>';
  else if(d&&d.erro)corpo+=`<p class="erro" role="alert" style="display:block">${esc(d.erro)}</p>`;
  else if(d){
    const li=(ok,t,dica)=>`<div class="item"><div class="grow"><div class="t">${ok?'✓':'✗'} ${esc(t)}</div>${!ok&&dica?`<div class="muted">${esc(dica)}</div>`:''}</div><div class="side"><span class="tag ${ok?'ok':'late'}">${ok?'OK':'Corrigir'}</span></div></div>`;
    corpo+='<div class="list">'+(d.grupos||[]).map(g=>li(g.pronto,g.nome,g.faltando&&g.faltando.length?'Falta na Vercel (Settings > Environment Variables): '+g.faltando.join(', ')+'. '+(g.como||''):'')).join('')+(d.testes||[]).map(t=>li(t.ok,t.nome,t.dica)).join('')+'</div>'+(d.webhook?`<p class="muted" style="font-size:13px;margin:8px 0 0">Endereço do aviso de pagamento (cadastre no Mercado Pago, em Webhooks): <b>${esc(d.webhook)}</b></p>`:'')+'<p class="muted" style="font-size:13px;margin:6px 0 0">Depois de mudar uma variável na Vercel, faça um novo Deploy (Redeploy).</p>';
  }
  return `<div class="panel" style="margin-bottom:14px"><b>Diagnóstico do pagamento online</b>${corpo}<div class="row-actions"><button class="btn ghost sm" data-act="plDiag">${d&&d!=='carregando'?'Testar de novo':'Testar agora'}</button></div></div>`;
}
async function rodarDiag(){
  S.pl.diag='carregando';render();
  try{
    const r=await fetch('/api/saude?testar=1',{cache:'no-store'});
    let j=null;try{j=await r.json()}catch(_){}
    if(!r.ok||!j||!j.grupos)S.pl.diag={erro:r.status===404||r.ok?'As funções do servidor não estão no ar: a pasta "api" não foi publicada na Vercel. Publique o site completo (index.html + pasta api + vercel.json) e tente de novo.':'O servidor respondeu com erro '+r.status+'.'};
    else S.pl.diag=j;
  }catch(_){S.pl.diag={erro:'Não foi possível falar com o servidor do site. Confira a conexão.'}}
  if(S.view==='plataforma')render();
}

function resumoLog(l){
  const d=l.detalhes||{};
  if(d.status)return 'situação: '+(ST_SAL[d.status]||d.status)+(d.motivo?' ('+d.motivo+')':'');
  if(d.solicitacao_plano)return 'pediu o plano '+d.solicitacao_plano+(d.mensagem?' ('+d.mensagem+')':'');
  if(d.plano)return 'plano alterado';
  if(d.vencimento)return 'vencimento: '+fd(d.vencimento);
  if(d.criado_pela_plataforma)return 'salão cadastrado pela plataforma';
  if(d.aceito)return 'convite aceito';
  if(d.role)return 'convite: '+(PAPEIS[d.role]||d.role);
  if(d.colunas)return 'campos: '+d.colunas.join(', ');
  if(d.valor!==undefined)return 'pagamento '+brl(d.valor);
  return '';
}

async function salvarMensagens(d){
  const m={};
  Object.keys(MSG_DEF).forEach(k=>{const t=String(d[k]||'').replace(/\r/g,'').trim();if(t&&t!==MSG_DEF[k].d)m[k]=t.slice(0,1000)});

  if(S.legado){LS.set('salao_mensagens',JSON.stringify(m));S.msgs=null;return 'local'}
  const r=await sb.from('tenants').update({mensagens:m}).eq('id',S.ctx.tenant.id);
  if(r.error){LS.set('salao_mensagens',JSON.stringify(m));S.msgs=null;S.msgsLocal=true;return 'local'}
  S.msgs=m;S.msgsLocal=false;return 'ok';
}

async function salvarPacote(cid,d){
  const nome=String(d.nome||'').trim(),total=Math.round(Number(d.total)||0),preco=din(d.preco);
  if(nome.length<2)throw erroUi('Dê um nome ao pacote.');
  if(total<1||total>100)throw erroUi('O pacote precisa ter de 1 a 100 sessões.');
  if(d.validade&&String(d.validade)<hoje())throw erroUi('A validade não pode ser no passado.');

async function salvarAtend(id,d){
  const pago=d.pago!=='0',pagForma=pago?(d.pagamento||''):'',cred=pagForma==='Cartão de crédito',cartao=cred||pagForma==='Cartão de débito';
  const v2=String(d.procedimento2||'').trim()?din(d.valor2):0,v1=din(d.valor);
  const o={cliente_id:d.clienteId,data:d.data,procedimento:d.procedimento.trim(),profissional:(d.profissional||profPadrao()||PROF).trim(),
    valor:v1+v2,pagamento:pagForma,parcelas:cred?PARC(d.parcelas):1,gasto_produtos:din(d.gastoProdutos),taxa_maquina:cartao?din(d.taxaMaquina):0,retorno:d.retorno||null,obs:(d.obs||'').trim()};
  if(!S.semEst)o.hora=d.hora||null;
  if(!S.semProc2)o.procedimento2=String(d.procedimento2||'').trim().slice(0,60);
  const antes=id&&S.atendTodos.find(x=>x.id===id);
  if(!S.semPago){o.valor2=v2;o.pago=pago;o.pago_em=pago?((antes&&antes.pago&&antes.pagoEm)||hoje()):null}
  if(!S.semDur)o.duracao=Math.min(720,Math.max(5,Math.round(Number(d.duracao)||60)));
  if(!id&&!S.semStatus)o.status='agendado';
  const aid=id||novoId();
  if(!id)o.id=aid;
  const grava=x=>id?sb.from('atendimentos').update(x).eq('id',id):sb.from('atendimentos').insert(x);
  let r=await grava(o);
  if(r.error&&/hora/i.test(String(r.error.message||''))&&(r.error.code==='42703'||r.error.code==='PGRST204'||/column/i.test(r.error.message||''))){
    delete o.hora;r=await grava(o);S.semHora=true;
  }
  if(r.error&&/duracao/i.test(String(r.error.message||''))){delete o.duracao;S.semDur=true;r=await grava(o)}
  if(r.error&&/procedimento2/i.test(String(r.error.message||''))){const quis=o.procedimento2;delete o.procedimento2;S.semProc2=true;if(quis)throw erroUi('Para usar dois procedimentos, rode o arquivo 14-dois-procedimentos.sql (ou o agendio-TUDO.sql) no Supabase.');r=await grava(o)}
  if(r.error&&/valor2|pago/i.test(String(r.error.message||''))&&(r.error.code==='42703'||r.error.code==='PGRST204'||/column/i.test(r.error.message||''))){
    delete o.valor2;delete o.pago;delete o.pago_em;S.semPago=true;
    if(!pago)throw erroUi('Para controlar pagamentos pendentes, rode o arquivo 22-valor2-pagamento.sql (ou o agendio-TUDO.sql) no Supabase.');
    r=await grava(o);
  }
  if(r.error)throw r.error;
  /* Estoque: refaz a baixa deste atendimento (devolve a anterior e dá a nova). */
  let msg=id?'Atendimento atualizado.':'Atendimento registrado.';
  if(!S.semEst){
    const baixa=d.baixa==='on',tinha=d.tinha==='1';
    try{
      if(tinha||(id&&baixa)){const x=await sb.from('movimentacoes_estoque').delete().eq('atendimento_id',aid);if(x.error)throw x.error}
      if(baixa){
        const linhas=[...fichaDe(o.procedimento),...(o.procedimento2?fichaDe(o.procedimento2):[])].map(({f,p})=>({id:novoId(),produto_id:p.id,data:o.data,tipo:'atendimento',quantidade:-r4(usoEf(p,f.quantidade)),motivo:'Atendimento: '+o.procedimento+(o.procedimento2?' + '+o.procedimento2:''),atendimento_id:aid}));
        if(linhas.length){const x=await sb.from('movimentacoes_estoque').insert(linhas);if(x.error)throw x.error;msg+=' Estoque atualizado.'}
      }else if(tinha)msg+=' Baixa do estoque desfeita.';
    }catch(_){msg+=' Atenção: não foi possível atualizar o estoque, confira na aba Estoque.'}
  }
  await recarregar();
  toast(msg);
}

const UN=['g','ml','un'],CAT_EST=['Cabelo','Unhas','Sobrancelha','Maquiagem','Depilação','Limpeza','Outros'];
const r3=n=>Math.round((Number(n)||0)*1e3)/1e3,r4=n=>Math.round((Number(n)||0)*1e4)/1e4;
const nTxt=(n,d=2)=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:d});
const erroAviso=m=>Object.assign(new Error(m),{aviso:m});
const rowP=r=>({id:r.id,nome:r.nome||'',categoria:r.categoria||'Outros',unidade:UN.includes(r.unidade)?r.unidade:'g',conteudo:Number(r.conteudo)>0?Number(r.conteudo):1,preco:Number(r.preco)||0,
  uso:Number(r.uso_aplicacao)||0,perda:Number(r.perda)||0,estoque:Number(r.estoque)||0,minimo:Number(r.minimo)||0,fornecedor:r.fornecedor||'',validade:r.validade||'',obs:r.obs||''});
const rowF=r=>({id:r.id,procedimento:r.procedimento||'',produtoId:r.produto_id,quantidade:Number(r.quantidade)||0});
const rowM=r=>({id:r.id,produtoId:r.produto_id,data:r.data,tipo:r.tipo,quantidade:Number(r.quantidade)||0,motivo:r.motivo||'',atendimentoId:r.atendimento_id||''});
/* Rendimento: quanto uma embalagem rende e quanto custa cada aplicação. */
const usoEf=(p,q)=>(Number(q)||0)*(1+(p.perda||0)/100);
const custoUso=(p,q)=>din((p.preco/p.conteudo)*usoEf(p,q));
const aplicPorEmb=p=>p.uso>0?Math.floor(p.conteudo/usoEf(p,p.uso)+1e-9):0;
const aplicRest=p=>p.uso>0&&p.estoque>0?Math.floor(p.estoque/usoEf(p,p.uso)+1e-9):0;
const custoAplic=p=>p.uso>0?custoUso(p,p.uso):0;
const nEmb=p=>p.estoque/p.conteudo;
const diasPara=d=>Math.floor((new Date(d+'T00:00:00')-new Date(hoje()+'T00:00:00'))/864e5);
const emFalta=p=>p.estoque<=0||(p.minimo>0&&p.estoque<p.minimo*p.conteudo);
const vencendo=p=>!!p.validade&&diasPara(p.validade)<=30;
const procsTodas=()=>{const l=[...PROCS];[...S.atend.map(a=>a.procedimento),...S.fichas.map(f=>f.procedimento)].forEach(x=>{if(x&&!l.includes(x))l.push(x)});return l};
const fichaDe=proc=>S.fichas.filter(f=>f.procedimento===proc).map(f=>({f,p:S.produtos.find(x=>x.id===f.produtoId)})).filter(x=>x.p);
const custoFicha=proc=>din(fichaDe(proc).reduce((t,x)=>t+custoUso(x.p,x.f.quantidade),0));
function tagsProd(p){
  const t=[];
  if(p.estoque<0)t.push('<span class="tag late">Estoque negativo</span>');
  else if(p.estoque<=0)t.push('<span class="tag late">Sem estoque</span>');
  else if(p.minimo>0&&p.estoque<p.minimo*p.conteudo)t.push('<span class="tag late">Estoque baixo</span>');
  if(p.validade){const d=diasPara(p.validade);if(d<0)t.push('<span class="tag late">Vencido</span>');else if(d<=30)t.push(`<span class="tag late">Vence em ${d} ${d===1?'dia':'dias'}</span>`)}
  return t.join(' ');
}

async function salvarMov(id,d){
  const p=S.produtos.find(x=>x.id===id);if(!p)throw new Error('produto');
  const q=Number(d.qtd);
  if(!(q>=0)||(d.tipo!=='ajuste'&&!(q>0)))throw erroAviso('Informe uma quantidade maior que zero.');
  let delta=d.tipo==='entrada'?q*p.conteudo:d.tipo==='saida'?-q*p.conteudo:q*p.conteudo-p.estoque;
  delta=r4(delta);
  if(d.tipo==='saida'&&p.estoque+delta<-1e-6)throw erroAviso(`Saída maior que o estoque (${nTxt(nEmb(p))} embalagens). Use "Ajuste" para corrigir a contagem.`);
  if(d.tipo==='ajuste'&&delta===0)throw erroAviso('O estoque já está com essa quantidade.');
  const r=await sb.from('movimentacoes_estoque').insert({id:novoId(),produto_id:id,data:d.data||hoje(),tipo:UN.length&&['entrada','saida','ajuste'].includes(d.tipo)?d.tipo:'ajuste',quantidade:delta,motivo:(d.motivo||'').trim()});
  if(r.error)throw r.error;

}

  return `<div class="stats"><div class="stat"><b>${brl(rec)}</b><span>recebido em ${esc(mesNome(mes))}${rPas>0?` · mês passado: ${brl(rPas)}`:''}</span></div><div class="stat"><b class="${res<0?'neg':''}">${brl(res)}</b><span>resultado do mês (recebido − despesas)</span></div><div class="stat"><b>${dia.length}</b><span>${dia.length===1?'atendimento hoje':'atendimentos hoje'}</span></div><div class="stat"><b>${brl(totFiado)}</b><span>a receber (fiado)</span></div></div>

/* ===== Agenda: serviços, horário de trabalho, bloqueios e conflitos ===== */
const erroUi=m=>Object.assign(new Error(m),{aviso:m});
const DIAS_SEM=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const hmin=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?(+m[1])*60+(+m[2]):null};
const servicosCat=()=>((S.agCfg&&S.agCfg.servicos)||[]).filter(x=>x&&x.nome&&x.ativo!==false);
function avisosAgenda(d,idAtual){
  const av=[],ini=hmin(d.hora),dur=Math.min(720,Math.max(5,Math.round(Number(d.duracao)||60)));
  if(ini===null||!d.data)return av;
  const fim=ini+dur,prof=(d.profissional||'').trim();
  S.atend.filter(a=>a.id!==idAtual&&a.data===d.data&&a.hora&&(!prof||a.profissional===prof)).forEach(a=>{
    const i=hmin(a.hora);if(i!==null&&i<fim&&ini<i+(a.duracao||60)){const c=cli(a.clienteId);av.push('Já existe atendimento às '+a.hora+(c?' ('+c.nome+')':'')+(prof?' com '+prof:'')+'.')}});
  (S.bloq||[]).filter(b=>b.data===d.data&&(!b.profissional||!prof||b.profissional===prof)).forEach(b=>{
    const bi=b.inicio?hmin(b.inicio):0,bf=b.inicio?hmin(b.fim):1440;
    if(bi<fim&&ini<bf)av.push('Horário bloqueado'+(b.profissional?' para '+b.profissional:'')+(b.motivo?': '+b.motivo:'')+'.')});
  const hp=prof&&((S.agCfg&&S.agCfg.profissionais)||{})[prof];
  if(hp&&hp.d){
    const wd=new Date(d.data+'T12:00:00').getDay(),dia=hp.d[wd];
    if(!dia)av.push(prof+' não trabalha '+DIAS_SEM[wd].toLowerCase()+'.');
    else{
      const di=hmin(dia[0]),df=hmin(dia[1]);
      if(di!==null&&df!==null&&(ini<di||fim>df))av.push('Fora do horário de '+prof+' ('+dia[0]+' às '+dia[1]+').');
      const ai=hp.a?hmin(hp.a[0]):null,af=hp.a?hmin(hp.a[1]):null;
      if(ai!==null&&af!==null&&ai<fim&&ini<af)av.push('Cai no horário de almoço de '+prof+' ('+hp.a[0]+' às '+hp.a[1]+').');
    }
  }
  return av;
}
async function salvarAgCfg(cfg){
  const r=await sb.from('tenants').update({agenda_config:cfg}).eq('id',S.ctx.tenant.id);
  if(r.error){if(/agenda_config/i.test(String(r.error.message||''))){S.semAg=true;throw erroUi('Rode o arquivo 12-agenda-horarios.sql no Supabase para usar serviços e horários.')}throw r.error}
  S.agCfg=cfg;S.sig='';
}
function telaHorarios(){
  if(S.semAg)return `<div class="panel"><b>Falta atualizar o banco</b><p class="muted" style="margin:6px 0 0">Rode o arquivo 12-agenda-horarios.sql (ou o agendio-TUDO.sql) no Supabase e atualize esta página.</p></div>`;
  const pode=NV('config')==='escrita',sv=servicosCat(),todos=(S.agCfg.servicos||[]);

  const bloco=(nome,i)=>{const c=hp[nome];return `<div class="panel" style="margin-bottom:12px"><input type="hidden" name="prof_${i}" value="${esc(nome)}"><b>${esc(nome)}</b>

  return blocoOnline(pode)+`<h3>Serviços</h3><p class="muted" style="max-width:640px;margin:0 0 8px">A duração evita dois atendimentos no mesmo horário e será usada no agendamento online.${sv.length?'':' Enquanto não houver serviços, a lista padrão do sistema é usada.'}</p>
  ${todos.length?`<div class="list">${todos.map(linhaServ).join('')}</div>`:''}
  ${pode?'<div class="row-actions" style="margin-top:10px"><button class="btn ghost" data-act="novoServico">Novo serviço</button></div>':''}
  <h3>Horário de trabalho</h3>
  <form data-form="horarios">${profs.map(bloco).join('')}<p class="erro" id="a-erro" role="alert"></p>${pode?'<div class="acts" style="justify-content:flex-start"><button class="btn">Salvar horários</button></div>':'<p class="muted">Só o proprietário altera os horários.</p>'}</form>`;
}
async function salvarHorarios(d){
  const profs=listaProfs(),out={};
  profs.forEach((nome,i)=>{
    const dd={};
    for(let n=0;n<7;n++){if(d[i+'_'+n+'_on']==='on'){const a=d[i+'_'+n+'_ini'],b=d[i+'_'+n+'_fim'];if(hmin(a)===null||hmin(b)===null||hmin(b)<=hmin(a))throw erroUi(nome+': confira o horário de '+DIAS_SEM[n]+' (o fim deve ser depois do início).');dd[n]=[a,b]}}
    if(!Object.keys(dd).length)return;
    const o={d:dd},ai=d[i+'_alm_ini'],af=d[i+'_alm_fim'];
    if(ai||af){if(hmin(ai)===null||hmin(af)===null||hmin(af)<=hmin(ai))throw erroUi(nome+': confira o horário de almoço.');o.a=[ai,af]}
    out[nome]=o;
  });
  await salvarAgCfg(Object.assign({},S.agCfg,{profissionais:out}));render();toast('Horários salvos.');
}

async function salvarServico(i,d){

/* ---------- Gráficos (SVG simples, sem biblioteca) ---------- */
const nice=v=>{if(!(v>0))return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e};
const eixoVal=v=>v>=10000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':Math.round(v).toLocaleString('pt-BR');
const brl0=v=>'R$ '+Math.round(v).toLocaleString('pt-BR');
const mesCurto=m=>{const [y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.','')};
const colTopo=(x,y,w,h,r)=>{if(h<=0)return '';r=Math.min(r,w/2,h);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`};
function grafColunas(o){
  const W=o.W,H=212,ml=48,mr=8,mt=20,mb=28,iw=W-ml-mr,ih=H-mt-mb,n=o.cats.length,ns=o.series.length;
  const max=Math.max(1,...o.cats.flatMap(c=>c.vals)),passo=o.inteiro?Math.max(1,Math.ceil(nice(max/4))):nice(max/4),nt=Math.ceil(max/passo-1e-9),topo=passo*nt;
  const banda=iw/n,bw=Math.max(4,Math.min(24,(banda-8)/ns-2)),grupo=bw*ns+2*(ns-1),y=v=>mt+ih-v/topo*ih;
  let g='';
  for(let i=0;i<=nt;i++){const v=i*passo;g+=`<line class="vz-grid" x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}"/><text class="vz-ax" x="${ml-6}" y="${y(v)+4}" text-anchor="end">${eixoVal(v)}</text>`}
  let mi=0,mk=0;o.cats.forEach((c,i)=>c.vals.forEach((v,k)=>{if(v>o.cats[mi].vals[mk]){mi=i;mk=k}}));
  o.cats.forEach((c,i)=>{
    const bx=ml+banda*i,x0=bx+(banda-grupo)/2;
    c.vals.forEach((v,k)=>{const h=v/topo*ih;if(h>0)g+=`<path class="vz-s${k}" d="${colTopo(x0+k*(bw+2),y(v),bw,h,4)}"/>`});
    g+=`<text class="vz-ax" x="${bx+banda/2}" y="${H-9}" text-anchor="middle">${esc(c.rot)}</text>`;
    g+=`<rect class="vz-hit" x="${bx}" y="${mt}" width="${banda}" height="${ih}" data-tip="${esc(c.tip)}"/>`;
  });
  const m0=o.cats[mi],vm=m0&&m0.vals[mk];
  if(vm>0){const cx=ml+banda*mi+(banda-grupo)/2+mk*(bw+2)+bw/2,al=cx<ml+36?'start':cx>W-mr-36?'end':'middle',lx=al==='start'?cx-bw/2:al==='end'?cx+bw/2:cx;
    g+=`<text class="vz-lab" x="${lx}" y="${y(vm)-6}" text-anchor="${al}">${(o.fmt||brl0)(vm)}</text>`}
  const keys=ns>1?`<div class="vz-keys">${o.series.map((t,k)=>`<span><i class="s${k}"></i>${esc(t)}</span>`).join('')}</div>`:'';
  const tab=`<details><summary>Ver como tabela</summary><table><thead><tr><th>${esc(o.catRot||'')}</th>${o.series.map(t=>`<th>${esc(t)}</th>`).join('')}</tr></thead><tbody>${o.cats.map(c=>`<tr><td>${esc(c.nome)}</td>${c.vals.map(v=>`<td>${(o.fmt||brl)(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></details>`;
  return `<div class="panel vz"><b>${esc(o.titulo)}</b><p class="muted sub">${esc(o.sub)}</p>${keys}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.titulo)}">${g}</svg>${tab}</div>`;
}

  const des=S.atend.filter(a=>String(a.data).startsWith(mes)).reduce((s,a)=>s+desp(a),0)+soma(gastosDoMes(mes));

function salvarArquivo(nome,txt,tipo){

  const a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),3000);

    partes.push(new Uint8Array(lh.buffer),nm,dados);

    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,dados.length,true);ch.setUint32(24,dados.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),nm);

const colL=i=>{let t='';i++;while(i>0){const r=(i-1)%26;t=String.fromCharCode(65+r)+t;i=Math.floor((i-1)/26)}return t};

    else if(k==='receber')await salvarReceber(id,dados);
    else if(k==='convite'){try{await salvarConvite(dados)}catch(x){if(x&&x.mantem)return;throw x}}
    else if(k==='membro')await salvarMembro(id,dados);
    else if(k==='suporte')await salvarSuporte(dados);
    else if(k==='chamado')await salvarChamado(dados);
    else if(k==='plplano')await salvarPlano(id,dados);
    else if(k==='exclsalao')await excluirSalao(dados.nome);
    else if(k==='plsalao'){try{await salvarNovoSalao(dados)}catch(x){if(x&&x.mantem)return;throw x}}
    else if(k==='meta'){LS.set('salao_meta',String(din(dados.valor)));toast('Meta salva.');render()}
    else if(k==='confirmar')await S.conf();
    $('dlg').close();
  }catch(err){falha(err)}
  finally{S.busy=false;bts.forEach(b=>{b.disabled=false})}
});
/* ---------- Limite de tentativas de login ---------- */
const LOCK_KEY='salao_login_lock',LIM=5;
function lerLock(){try{const o=JSON.parse(localStorage.getItem(LOCK_KEY)||'{}');return {n:+o.n||0,ate:+o.ate||0}}catch(_){return {n:0,ate:0}}}
function gravaLock(o){try{localStorage.setItem(LOCK_KEY,JSON.stringify(o))}catch(_){}}
function falhaLogin(){const o=lerLock();o.n++;if(o.n>=LIM){const seg=Math.min(900,30*Math.pow(2,o.n-LIM));o.ate=Date.now()+seg*1000}gravaLock(o);return o}
function esperaLogin(){const o=lerLock();return Math.max(0,Math.ceil((o.ate-Date.now())/1000))}
function tempoTxt(sg){return sg>=60?Math.ceil(sg/60)+' min':sg+' s'}

document.addEventListener('submit',async e=>{
  const f=e.target,k=f.dataset&&f.dataset.form;
  if(!['criar','recuperar','novasenha','salao','config','mensagens','horarios','online','pub','mpconectar'].includes(k))return;
  e.preventDefault();if(S.busy||!sb)return;
  const d=Object.fromEntries(new FormData(f)),bt=f.querySelector('button'),er=$('a-erro');
  const ver=(c,m)=>{if(c){er.textContent=m;return true}return false};
  er.textContent='';
  if(k==='criar'||k==='novasenha'){
    if(ver(String(d.senha||'').length<8,'A senha precisa ter 8 caracteres ou mais.'))return;
    if(ver(d.senha!==d.senha2,'As duas senhas não são iguais.'))return;
  }
  S.busy=true;bt.disabled=true;
  try{
    if(k==='criar'){
      const em=String(d.email||'').trim();
      const r=await sb.auth.signUp({email:em,password:d.senha,options:{emailRedirectTo:location.origin+location.pathname}});
      if(r.error){er.textContent=msgAuth(r.error.message,r.error.status);return}
      const u=r.data&&r.data.user;
      if(u&&Array.isArray(u.identities)&&u.identities.length===0){er.textContent='Este e-mail já tem cadastro. Entre ou recupere a senha.';return}
      if(!(r.data&&r.data.session)){S.auth='entrar';S.aviso='Conta criada. Enviamos um link de confirmação para '+em+'. Confirme o e-mail e depois entre aqui.';render()}
    }else if(k==='recuperar'){
      const r=await sb.auth.resetPasswordForEmail(String(d.email||'').trim(),{redirectTo:location.origin+location.pathname});
      if(r.error){er.textContent=msgAuth(r.error.message,r.error.status);return}
      S.auth='entrar';S.aviso='Se o e-mail estiver cadastrado, você vai receber um link para criar uma nova senha.';render();
    }else if(k==='novasenha'){
      const r=await sb.auth.updateUser({password:d.senha});
      if(r.error){er.textContent=msgAuth(r.error.message,r.error.status);return}
      S.recuperando=false;try{history.replaceState(null,'',location.pathname)}catch(_){}
      render();toast('Senha alterada.');
    }else if(k==='pub'){
      await salvarPub(d,er);
    }else if(k==='mpconectar'){
      try{const j=await chamaApi('mp-conectar',{token:d.token});S.onl.mp=true;S.sig='';render();toast('Mercado Pago conectado.')}catch(x){er.textContent=String((x&&(x.aviso||x.message))||'Não foi possível conectar.')}
    }else if(k==='online'){
      try{await salvarOnline(d)}catch(x){er.textContent=String((x&&(x.aviso||x.message))||'Não foi possível salvar.')}
    }else if(k==='horarios'){
      try{await salvarHorarios(d)}catch(x){er.textContent=String((x&&x.message)||'Não foi possível salvar.')}
    }else if(k==='mensagens'){
      const r=await salvarMensagens(d);render();
      toast(r==='ok'?'Mensagens salvas.':'Mensagens salvas neste aparelho.');
    }else if(k==='config'){
      const p={};['nome','razao_social','documento','proprietario_nome','telefone','whatsapp','email','cep','numero','logradouro','complemento','bairro','cidade','uf'].forEach(x=>{p[x]=String(d[x]||'').trim()});
      p.uf=p.uf.toUpperCase();p.cor_principal=d.cor_principal;
      const dg=p.documento.replace(/\D/g,'');
      if(dg&&dg.length!==11&&dg.length!==14){er.textContent='CPF deve ter 11 números e CNPJ 14.';return}
      p.doc_tipo=dg.length===11?'cpf':dg.length===14?'cnpj':null;p.documento=dg||null;
      if(S.logoNovo!==undefined)p.logo_url=S.logoNovo;
      const r=await sb.from('tenants').update(p).eq('id',S.ctx.tenant.id);
      if(r.error){er.textContent=r.error.code==='23514'?'Confira a cor, o logotipo e os dados digitados.':'Não foi possível salvar. Tente de novo.';return}
      await carregarCtx();await carregarSalao();render();toast('Dados do salão salvos.');
    }else if(k==='salao'){
      const p={};Object.keys(d).forEach(x=>{p[x]=String(d[x]||'').trim()});
      p.email=(S.sessao&&S.sessao.user&&S.sessao.user.email)||'';p.uf=p.uf.toUpperCase();
      const r=await sb.rpc('criar_salao',{p});
      if(r.error){er.textContent=String(r.error.message||'Não foi possível cadastrar o salão.');return}
      S.view='inicio';parar();iniciar();
    }
  }catch(err){er.textContent='Sem conexão. Verifique a internet e tente de novo.'}
  finally{S.busy=false;if(bt)bt.disabled=false}
});
document.addEventListener('submit',async e=>{
  const f=e.target;if(!f.dataset||f.dataset.form!=='login')return;
  e.preventDefault();if(S.busy||!sb)return;
  const d=Object.fromEntries(new FormData(f)),bt=f.querySelector('button'),er=$('l-erro');
  const det=$('l-det');
  const w=esperaLogin();
  if(w>0){er.textContent='Muitas tentativas de entrada. Aguarde '+tempoTxt(w)+' e tente de novo.';return}
  S.busy=true;bt.disabled=true;er.textContent='';det.textContent='';
  try{
    const r=await sb.auth.signInWithPassword({email:String(d.email||'').trim(),password:String(d.senha||'')});
    if(!r.error)gravaLock({n:0,ate:0});
    if(r.error){
      const m=String(r.error.message||'');
      const lk=/invalid login credentials/i.test(m)||r.error.status===429?falhaLogin():null;
      const w2=lk?esperaLogin():0;
      er.textContent=w2>0?'Muitas tentativas de entrada. Aguarde '+tempoTxt(w2)+' e tente de novo.':r.error.status===429?'Muitas tentativas. Aguarde alguns minutos.':/^invalid login credentials$/i.test(m)?'E-mail ou senha incorretos.':
        /api key|apikey/i.test(m)?'O site não conseguiu se identificar no Supabase. Avise quem configurou o site.':
        /not confirmed/i.test(m)?'Este e-mail ainda não foi confirmado no Supabase.':
        'Não foi possível entrar. Tente de novo.';
      det.textContent='Detalhe técnico: '+m+(r.error.status?' (código '+r.error.status+')':'');
    }
  }catch(err){
    er.textContent='Sem conexão com o Supabase. Verifique a internet e tente de novo.';
    det.textContent='Detalhe técnico: '+String((err&&err.message)||err);
  }
  finally{S.busy=false;bt.disabled=false}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)recarregar()});
setInterval(()=>{if(!document.hidden&&!S.busy){recarregar();carregarPend()}},60000);

/* ---------- Início ---------- */
async function boot(){
  render();
  const okCfg=CFG.url&&CFG.anonKey&&!/COLE_AQUI/.test(CFG.url+CFG.anonKey);
  if(!okCfg){S.pronto=true;S.semConfig=true;render();return}
  if(!window.supabase||!window.supabase.createClient){S.pronto=true;S.semLib=true;render();return}
  sb=window.supabase.createClient(CFG.url,CFG.anonKey);
  if(PUB_SLUG&&location.protocol!=='file:'&&!window.__SEM_REDIRECT){location.replace('/a/'+encodeURIComponent(PUB_SLUG));return}
  if(PUB_SLUG){S.pubSlug=PUB_SLUG;S.pronto=true;await carregarPublico();return}
  try{const r=await sb.auth.getSession();S.sessao=(r&&r.data&&r.data.session)||null}catch(_){S.sessao=null}
  sb.auth.onAuthStateChange((ev,ses)=>{
    const antes=!!S.sessao;S.sessao=ses||null;
    if(ev==='PASSWORD_RECOVERY'){S.recuperando=true;render()}
    if(ev==='SIGNED_OUT'){S.recuperando=false;S.auth='entrar'}
    if(ses){setTimeout(iniciar,0)}else parar();
    if(antes!==!!ses)render();
  });
  S.pronto=true;render();
  if(S.sessao)iniciar();
}
boot();
})();
